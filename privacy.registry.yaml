  - schema: hub
    table: contacts
    field: billing_address
    category: contact
    retention: >-
      Adresse de facturation, reprise à l'envoi en signature (D8).
      Lot 36a (CRM-03, D9, ADR 0069) : contact unique de l'organisation. Client d'un
      évènement : la règle de son évènement (prospect ou client, RGPD-05) ; sans évènement :
      la règle des prospects, à compter de sa dernière modification. Après une demande
      d'oubli : voir RGPD-03.
    anonymization: >-
      Mis à nul à l'oubli ou à la purge ; les copies figées des signataires et des factures suivent leurs propres règles.
  - schema: hub
    table: contact_notes
    field: body
    category: identifiant
    retention: >-
      Lot 36a (CRM-03) : note de l'équipe sur un contact ; elle suit son contact.
    anonymization: >-
      Supprimée avec les coordonnées du contact à l'oubli ou à la purge.
  - schema: hub
    table: contact_notes
    field: body_sealed
    category: contenu_libre
    retention: >-
      Lot 48a (DAT-08, ADR 0093) : note de l'équipe marquée confidentielle, chiffrée au niveau du
      champ (body est vide) ; lue par son auteur et la titulaire seuls, absente des recherches et de
      l'export complet ; rendue en clair à la personne qui exerce son droit d'accès. Elle suit son
      contact.
    anonymization: >-
      Supprimée avec les coordonnées du contact à l'oubli ou à la purge.
  - schema: hub
    table: contacts
    field: company_id_number
    category: identifiant
    retention: >-
      Lot 36b (CRM-03, SC-11) : SIREN ou SIRET d'une entreprise cliente, repris sur ses
      devis ; donnée personnelle pour un entrepreneur individuel. Suit son contact (règle de
