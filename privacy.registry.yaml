# Registre des champs personnels (SOC-07, CLAUDE.md §2.8). Chaque champ
# personnel nouveau doit être déclaré ici avant/au moment de sa migration —
# sinon la CI échoue (packages/privacy/scripts/check-registry.ts).
#
# Copies hors ligne du jour J (lot 29a, ADR 0064) : aucun champ nouveau. Sur un geste de la
# planner (« Garder sur cet appareil »), l'écran du jour J copie dans le navigateur de son
# téléphone des champs déjà déclarés ci-dessous : noms, téléphones et e-mails des clients
# (hub.contacts, lot 36a) et des prestataires retenus (vendors.vendors), programme et notes
# internes (events.program_items), lieux (events.event_places). La copie s'efface au retrait,
# à la déconnexion, à la connexion d'un autre compte et le lendemain de l'évènement à minuit ;
# elle n'est pas chiffrée par l'application (verrouillage du téléphone).
#
# Fournisseur d'identité (lot 33, ADR 0067) : Logto garde dans sa base dédiée (hors des schémas de
# l'app) l'adresse e-mail du compte, ses clés d'accès, ses seconds facteurs, ses codes de secours
# et son mot de passe s'il en a un ; il les supprime avec le compte. Ses journaux de requêtes
# contiennent l'adresse e-mail (paramètre login_hint de ses pages) : ils restent sur le VPS et
# tournent sur deux fichiers de 5 Mo au plus (docker-compose.prod.yml, service logto).
#
# Flux de calendrier (lot 38b, HUB-29, D12, ADR 0072) : aucun champ nouveau. L'adresse secrète d'une
# personne de l'équipe (hub.calendar_feeds n'en garde que l'empreinte) livre à l'agenda qu'elle
# abonne les prénoms des clients (hub.contacts), le type, la date et le lieu des évènements datés,
# et le programme d'un évènement (events.program_items, sans note interne). L'agenda abonné en garde
# une copie, hors de Symbola ; retirer ou régénérer l'adresse arrête les mises à jour, sans effacer
# ce que l'agenda a déjà copié ; l'adresse d'une personne retirée de l'équipe ne répond plus.
#
# Jour J de terrain (lot 51, ADR 0091, DPO-9) : la file d'actions de l'appareil (IndexedDB
# « symbola-jour-j-file ») garde, jusqu'à leur envoi, les pointages, décalages, incidents, cases,
# remises et photos faits sans réseau ; seule l'action de son auteur part, avec sa session. Elle
# n'est pas chiffrée par l'application (verrouillage du téléphone) et se vide à l'envoi.
version: 1
fields:
  - schema: hub
    table: users
    field: idp_subject
    category: identifiant
    retention: >-
      Tant que le compte existe : identifiant du compte chez le fournisseur d'identité (lot 33,
      ADR 0067), pseudonyme, sans autre donnée.
    anonymization: >-
      Supprimé avec le compte ; le compte chez le fournisseur est supprimé avec lui.
  - schema: hub
    table: users
    field: email
    category: identifiant
    retention: >-
      Tant que le compte existe. Après suppression ou demande d'oubli :
      voir RGPD-03/RGPD-05 (purge selon les règles de conservation du
      cahier des charges).
    anonymization: >-
      Comptes de l'équipe de la planner et de l'Admin seulement : depuis le lot
      26a (ADR 0053), les tiers n'ont plus de compte ; leur lien personnel est
      déclaré sous events.event_links.
  - schema: hub
    table: users
    field: last_login_at
    category: securite
    retention: >-
      Lot 6 (RGPD-05) : date de la dernière connexion réussie, mise à jour à
      chaque connexion. Gardée tant que le compte existe (lot 26a : les comptes
      de mariés, dont elle réglait la suppression, n'existent plus).
    anonymization: >-
      Supprimée avec le compte (oubli ou purge).
  - schema: hub
    table: privacy_purges
    field: lines
    category: contenu_libre
    retention: >-
      Lot 6 (RGPD-05) : trace d'une purge validée ; seul le motif d'exclusion
      d'une ligne est un texte libre saisi par la titulaire (qui peut citer une
      personne). Références opaques et dates sinon, jamais de nom. Gardée
      comme preuve pendant la prescription applicable.
    anonymization: >-
      Motifs d'exclusion effacés à la fin de la conservation de la preuve.
  - schema: hub
    table: organization_profiles
    field: address
    category: contact
    retention: >-
      Tant que l'organisation existe. Après suppression ou demande
      d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par une valeur générée non réversible lors d'une demande
      d'oubli (RGPD-03).
  - schema: hub
    table: organization_profiles
    field: postal_code
    category: contact
    retention: >-
      Lot 41 (FAC-10, JUR-02, D7) : code postal de l'adresse de l'organisation, structurée pour le
      fichier Factur-X (address en est la ligne) ; celle d'une entrepreneuse individuelle peut être
      son domicile. Tant que l'organisation existe ; les factures émises en gardent la copie figée.
    anonymization: >-
      Comme organization_profiles.address (demande d'oubli de l'organisation, RGPD-03).
  - schema: hub
    table: organization_profiles
    field: city
    category: contact
    retention: >-
      Lot 41 (FAC-10, JUR-02, D7) : ville de l'adresse de l'organisation. Même conservation que
      postal_code.
    anonymization: >-
      Comme organization_profiles.address (demande d'oubli de l'organisation, RGPD-03).
  - schema: hub
    table: organization_profiles
    field: contact_email
    category: contact
    retention: >-
      Lot 17 (DEV-07) : e-mail de contact imprimé sur les devis et les
      factures, celui d'une entrepreneuse individuelle pouvant être
      personnel. Tant que l'organisation existe ; modifiable et effaçable
      par elle dans Entreprise et TVA. Les documents émis en gardent la
      copie figée (seller_snapshot).
    anonymization: >-
      Effacé avec la fiche de l'organisation ; les copies figées suivent la
      conservation de leur document.
  - schema: hub
    table: organization_profiles
    field: contact_phone
    category: contact
    retention: >-
      Lot 17 (DEV-07) : téléphone de contact imprimé sur les devis et les
      factures. Même conservation que contact_email.
    anonymization: >-
      Effacé avec la fiche de l'organisation ; les copies figées suivent la
      conservation de leur document.
  - schema: quotes
    table: quote_settings
    field: iban
    category: identifiant
    retention: >-
      Lot 17 (DEV-11) : IBAN imprimé sur les devis et les factures pour le
      virement des clients ; celui d'une entrepreneuse individuelle est une
      donnée personnelle. Tant que l'organisation le garde dans ses
      réglages ; jamais écrit dans les journaux. Les documents émis en
      gardent la copie figée (seller_snapshot).
    anonymization: >-
      Effacé avec les réglages de l'organisation ; les copies figées
      suivent la conservation de leur document.
  - schema: quotes
    table: quote_settings
    field: iban_sealed
    category: identifiant
    retention: >-
      Lot 48a (DAT-08, ADR 0093) : l'IBAN de la planner, chiffré au niveau du champ (field-box,
      DATA_ENCRYPTION_KEY) depuis la migration 0176 et son étape de données ; la colonne iban
      reste vide. Déchiffré par le module des devis à l'affichage et dans les documents ; sorti en
      clair dans l'export complet de l'organisation (champ iban, contrat export/v1).
    anonymization: >-
      Effacé avec les réglages de l'organisation ; les copies figées suivent la conservation de
      leur document.
  - schema: quotes
    table: quote_settings
    field: bic_sealed
    category: identifiant
    retention: >-
      Lot 48a (DAT-08) : le BIC de la planner, chiffré comme son IBAN.
    anonymization: >-
      Effacé avec les réglages de l'organisation.
  - schema: hub
    table: invitations
    field: email
    category: identifiant
    retention: >-
      7 jours (durée de validité de l'invitation, PRD PRD-HUB-03), puis
      purgée ou anonymisée après expiration ou acceptation — à outiller
      avec la purge RGPD-05.
    anonymization: >-
      Remplacé par une valeur générée non réversible lors d'une demande
      d'oubli (RGPD-03) antérieure à l'expiration.
  - schema: hub
    table: imports
    field: rows
    category: identifiant
    retention: >-
      Lot 5 (IMP-01) : lignes lues du fichier d'import (noms, e-mails, dates
      des clients…), gardées seulement le temps de finir l'import en cours —
      effacées à la confirmation, à l'abandon ou à l'expiration (7 jours
      proposés, réglage de la plateforme, purge horaire). Le fichier lui-même
      n'est jamais stocké.
    anonymization: >-
      Effacées (null) lors d'une demande d'oubli (RGPD-03) visant une personne
      présente dans un import en cours.
  - schema: hub
    table: imports
    field: headers
    category: identifiant
    retention: >-
      Lot 5 (IMP-01) : intitulés des colonnes du fichier (une colonne sans
      en-tête peut porter une valeur à la place) ; conservés au journal des
      imports tant que l'organisation existe. Voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacés par des intitulés génériques lors d'une demande d'oubli
      (RGPD-03).
  - schema: hub
    table: import_jobs
    field: payload
    category: identifiant
    retention: >-
      Lot 15 (IMP-10) : noms des fiches PDF en cours de lecture, avec l'adresse
      et la clé de chaque fiche gardée chiffrée. Effacés dès la fin de la
      lecture, l'abandon ou l'expiration de l'import (les fiches sont alors
      supprimées du stockage).
    anonymization: >-
      Rien à anonymiser au-delà de la lecture : la liste des fiches est vidée.
  - schema: hub
    table: imports
    field: file_name
    category: identifiant
    retention: >-
      Lot 5 (IMP-01) : nom du fichier importé (peut contenir un nom de
      client), au journal des imports tant que l'organisation existe. Voir
      RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli (RGPD-03).
  - schema: hub
    table: import_items
    field: previous
    category: identifiant
    retention: >-
      Lot 5 (IMP-05) : valeurs d'un élément avant qu'un import confirmé le
      mette à jour (noms des clients, montants…), gardées pour pouvoir annuler
      l'import pendant le délai réglé par l'Admin (90 jours), puis effacées par
      la purge horaire ; la ligne du journal reste.
    anonymization: >-
      Effacées (null) lors d'une demande d'oubli (RGPD-03) ; l'import concerné
      n'est alors plus annulable pour cet élément.
  - schema: hub
    table: import_items
    field: written
    category: identifiant
    retention: >-
      Lot 5 (IMP-05) : valeurs écrites par un import confirmé, gardées pour
      détecter une modification à la main avant une annulation, pendant le
      délai d'annulation (90 jours), puis effacées par la purge horaire.
    anonymization: >-
      Effacées (null) lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: events
    field: imported_fields
    category: contenu_libre
    retention: >-
      Lot 5 (IMP-04/IMP-05) : colonnes d'un fichier importé gardées en champ
      libre sur la fiche (peuvent contenir un e-mail, un téléphone…). Tant que
      l'événement existe. Voir RGPD-03/RGPD-05.
    anonymization: >-
      Effacés (null) lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: event_tasks
    field: imported_fields
    category: contenu_libre
    retention: >-
      Lot 5 (IMP-04/IMP-05) : champs libres d'une tâche importée, tant que la
      tâche existe. Voir RGPD-03/RGPD-05.
    anonymization: >-
      Effacés (null) lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: event_vendor_slots
    field: imported_fields
    category: contenu_libre
    retention: >-
      Lot 5 (IMP-04/IMP-05) : champs libres d'un poste importé avec une ligne
      de budget, tant que le poste existe. Voir RGPD-03/RGPD-05.
    anonymization: >-
      Effacés (null) lors d'une demande d'oubli (RGPD-03).
  - schema: quotes
    table: catalog_items
    field: imported_fields
    category: contenu_libre
    retention: >-
      Lot 5 (IMP-04/IMP-05) : champs libres d'un article importé, tant que
      l'article existe.
    anonymization: >-
      Effacés (null) lors d'une demande d'oubli (RGPD-03) qui les viserait.
  - schema: hub
    table: privacy_requests
    field: person_label
    category: identifiant
    retention: >-
      Lot 6 (RGPD-04) : personne concernée par une demande d'exercice de droits
      (libellé saisi par la titulaire). Gardé avec la demande, comme preuve de
      son traitement, pendant la prescription applicable (cahier des charges
      § 6, référentiel CNIL) : durée réglée par l'organisation après le jour
      de clôture (hub.privacy_settings.request_proof_retention_months, 5 ans
      par défaut, prescription civile, décision de Julien du 09/11/2026, à
      valider par un juriste ; lot 19, RGPD-09, ADR 0048). Une demande en
      cours est gardée telle quelle.
    anonymization: >-
      Remplacé par « [anonymisé] » à la fin de la conservation de la preuve,
      par la purge mensuelle validée par la titulaire (RGPD-05, RGPD-09) ; le
      type, les dates et le journal de la demande restent. Affiché traduit à
      l'écran.
  - schema: hub
    table: privacy_requests
    field: extension_reason
    category: contenu_libre
    retention: >-
      Lot 6 (RGPD-04) : motif de prolongation d'une demande complexe, gardé
      avec la demande pendant la même durée (preuve, RGPD-09).
    anonymization: >-
      Effacé (null) à la fin de la conservation de la preuve, par la même
      ligne de la purge mensuelle que le nom de la personne (RGPD-09).
  - schema: events
    table: event_clients
    field: first_name
    category: identifiant
    retention: >-
      Colonne retirée au lot 36a (migration 0135, ADR 0069) : le nom et les coordonnées
      d'un client sont repris dans son contact (hub.contacts). Entrée gardée parce que
      la migration qui l'a créée reste dans l'historique.
    anonymization: >-
      Sans objet depuis le lot 36a (colonne supprimée) ; voir hub.contacts.
  - schema: events
    table: event_clients
    field: last_name
    category: identifiant
    retention: >-
      Colonne retirée au lot 36a (migration 0135, ADR 0069) : le nom et les coordonnées
      d'un client sont repris dans son contact (hub.contacts). Entrée gardée parce que
      la migration qui l'a créée reste dans l'historique.
    anonymization: >-
      Sans objet depuis le lot 36a (colonne supprimée) ; voir hub.contacts.
  - schema: events
    table: event_clients
    field: email
    category: contact
    retention: >-
      Colonne retirée au lot 36a (migration 0135, ADR 0069) : le nom et les coordonnées
      d'un client sont repris dans son contact (hub.contacts). Entrée gardée parce que
      la migration qui l'a créée reste dans l'historique.
    anonymization: >-
      Sans objet depuis le lot 36a (colonne supprimée) ; voir hub.contacts.
  - schema: events
    table: event_clients
    field: phone
    category: contact
    retention: >-
      Colonne retirée au lot 36a (migration 0135, ADR 0069) : le nom et les coordonnées
      d'un client sont repris dans son contact (hub.contacts). Entrée gardée parce que
      la migration qui l'a créée reste dans l'historique.
    anonymization: >-
      Sans objet depuis le lot 36a (colonne supprimée) ; voir hub.contacts.
  - schema: events
    table: event_clients
    field: address_line
    category: contact
    retention: >-
      Colonne retirée au lot 36a (migration 0135, ADR 0069) : le nom et les coordonnées
      d'un client sont repris dans son contact (hub.contacts). Entrée gardée parce que
      la migration qui l'a créée reste dans l'historique.
    anonymization: >-
      Sans objet depuis le lot 36a (colonne supprimée) ; voir hub.contacts.
  - schema: events
    table: event_clients
    field: postal_code
    category: contact
    retention: >-
      Colonne retirée au lot 36a (migration 0135, ADR 0069) : le nom et les coordonnées
      d'un client sont repris dans son contact (hub.contacts). Entrée gardée parce que
      la migration qui l'a créée reste dans l'historique.
    anonymization: >-
      Sans objet depuis le lot 36a (colonne supprimée) ; voir hub.contacts.
  - schema: events
    table: event_clients
    field: city
    category: contact
    retention: >-
      Colonne retirée au lot 36a (migration 0135, ADR 0069) : le nom et les coordonnées
      d'un client sont repris dans son contact (hub.contacts). Entrée gardée parce que
      la migration qui l'a créée reste dans l'historique.
    anonymization: >-
      Sans objet depuis le lot 36a (colonne supprimée) ; voir hub.contacts.
  - schema: hub
    table: contacts
    field: first_name
    category: identifiant
    retention: >-
      Prénom d'une personne.
      Lot 36a (CRM-03, D9, ADR 0069) : contact unique de l'organisation. Client d'un
      évènement : la règle de son évènement (prospect ou client, RGPD-05) ; sans évènement :
      la règle des prospects, à compter de sa dernière modification. Après une demande
      d'oubli : voir RGPD-03.
    anonymization: >-
      Remplacé par « [anonymisé] » à l'oubli (RGPD-03) ou à la purge (RGPD-05).
  - schema: hub
    table: contacts
    field: last_name
    category: identifiant
    retention: >-
      Nom d'une personne.
      Lot 36a (CRM-03, D9, ADR 0069) : contact unique de l'organisation. Client d'un
      évènement : la règle de son évènement (prospect ou client, RGPD-05) ; sans évènement :
      la règle des prospects, à compter de sa dernière modification. Après une demande
      d'oubli : voir RGPD-03.
    anonymization: >-
      Mis à nul à l'oubli ou à la purge.
  - schema: hub
    table: contacts
    field: name
    category: identifiant
    retention: >-
      Nom d'un foyer ou d'une entreprise.
      Lot 36a (CRM-03, D9, ADR 0069) : contact unique de l'organisation. Client d'un
      évènement : la règle de son évènement (prospect ou client, RGPD-05) ; sans évènement :
      la règle des prospects, à compter de sa dernière modification. Après une demande
      d'oubli : voir RGPD-03.
    anonymization: >-
      Remplacé par « [anonymisé] » à l'oubli ou à la purge.
  - schema: hub
    table: contacts
    field: email
    category: contact
    retention: >-
      Adresse e-mail (unique dans l'organisation, DAT-12).
      Lot 36a (CRM-03, D9, ADR 0069) : contact unique de l'organisation. Client d'un
      évènement : la règle de son évènement (prospect ou client, RGPD-05) ; sans évènement :
      la règle des prospects, à compter de sa dernière modification. Après une demande
      d'oubli : voir RGPD-03.
    anonymization: >-
      Mis à nul à l'oubli ou à la purge.
  - schema: hub
    table: contacts
    field: phone
    category: contact
    retention: >-
      Téléphone.
      Lot 36a (CRM-03, D9, ADR 0069) : contact unique de l'organisation. Client d'un
      évènement : la règle de son évènement (prospect ou client, RGPD-05) ; sans évènement :
      la règle des prospects, à compter de sa dernière modification. Après une demande
      d'oubli : voir RGPD-03.
    anonymization: >-
