  - schema: hub
    table: contacts
    field: address_line
    category: contact
    retention: >-
      Adresse.
      Lot 36a (CRM-03, D9, ADR 0069) : contact unique de l'organisation. Client d'un
      évènement : la règle de son évènement (prospect ou client, RGPD-05) ; sans évènement :
