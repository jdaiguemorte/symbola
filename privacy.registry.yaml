  - schema: hub
    table: contacts
    field: vat_number
    category: identifiant
    retention: >-
      Lot 36b (CRM-03, SC-11) : numéro de TVA intracommunautaire d'une entreprise cliente,
      repris sur ses devis. Suit son contact.
    anonymization: >-
      Mis à nul à l'oubli ou à la purge.
  - schema: hub
    table: contact_members
    field: role
    category: identifiant
    retention: >-
      Lot 36b (CRM-03, D2) : rôle libre d'une personne dans un foyer ou une entreprise
      (« mariée », « assistante de direction »). Le lien suit ses deux contacts ; il disparaît
      avec l'un d'eux.
    anonymization: >-
      Mis à nul quand la personne ou le groupe est anonymisé (oubli ou purge).
  - schema: events
    table: program_item_participants
    field: free_label
    category: identifiant
    retention: >-
      Tant que l'événement existe (intervenant libre du programme du jour J,
      PRD-EVT-05 : officiant, témoin…). Après suppression ou demande d'oubli :
      voir RGPD-03/RGPD-05.
    anonymization: >-
      L'intervenant est supprimé lors d'une demande d'oubli qui le vise (RGPD-03),
      comme lors d'un effacement.
  - schema: events
    table: event_places
    field: address
    category: contact
    retention: >-
      Lot 12 (L12-EVT-15) : adresse d'un lieu de l'événement (celle des préparatifs
      peut être le domicile des mariés). Tant que l'événement existe ; voir
      RGPD-03/RGPD-05.
    anonymization: >-
      Le lieu est supprimé lors d'une demande d'oubli qui le vise ou qui vise
      l'événement (RGPD-03), comme le lieu de réception de l'événement.
  - schema: events
    table: event_places
    field: city
    category: contact
    retention: >-
      Lot 34b (EVT-03, D10) : ville d'un lieu de l'événement ; celle du premier lieu est la ville du
      lieu de réception (reprise des anciennes colonnes venue_city). Tant que l'événement existe ;
      voir RGPD-03/RGPD-05.
    anonymization: >-
      Supprimée avec le lieu lors d'une demande d'oubli qui le vise ou qui vise l'événement
      (RGPD-03).
  - schema: events
    table: event_places
    field: contact_name
    category: identifiant
    retention: >-
      Lot 34b (EVT-03, D10) : nom du contact d'un lieu (régisseur, propriétaire), trouvé par la
      recherche RGPD. Tant que l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Supprimé avec le lieu lors d'une demande d'oubli qui le vise ou qui vise l'événement
      (RGPD-03).
  - schema: events
    table: event_places
    field: contact_phone
    category: contact
    retention: >-
      Lot 34b (EVT-03, D10) : téléphone du contact d'un lieu. Tant que l'événement existe ; voir
      RGPD-03/RGPD-05.
    anonymization: >-
      Supprimé avec le lieu lors d'une demande d'oubli qui le vise ou qui vise l'événement
      (RGPD-03).
  - schema: events
    table: event_places
    field: contact_email
    category: contact
    retention: >-
      Lot 34b (EVT-03, D10) : e-mail du contact d'un lieu. Tant que l'événement existe ; voir
      RGPD-03/RGPD-05.
    anonymization: >-
      Supprimé avec le lieu lors d'une demande d'oubli qui le vise ou qui vise l'événement
      (RGPD-03).
  - schema: events
    table: events
    field: style
    category: contenu_libre
    retention: >-
      Lot 34b (EVT-03, D11) : style de l'événement en texte libre, saisi par l'équipe ; trouvé par la
      recherche RGPD. Tant que l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Effacé lors d'une demande d'oubli qui vise l'événement (RGPD-03) ; les nombres d'invités,
      sans donnée personnelle, restent.
  - schema: events
    table: events
    field: notes
    category: contenu_libre
    retention: >-
      Lot 34b (EVT-03, D11) : notes libres de la fiche (allergies, contraintes), saisies par
      l'équipe ; trouvées par la recherche RGPD. Tant que l'événement existe ; voir
      RGPD-03/RGPD-05.
    anonymization: >-
      Effacées lors d'une demande d'oubli qui vise l'événement (RGPD-03).
  - schema: events
    table: program_items
    field: internal_note
    category: contenu_libre
    retention: >-
      Tant que l'événement existe (note interne d'une ligne du programme,
      PRD-EVT-05, jamais montrée aux mariés). Après suppression ou demande
      d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      La ligne du programme est supprimée lors d'une demande d'oubli qui la vise
      (RGPD-03) ; texte libre, sans intérêt statistique.
  - schema: events
    table: program_items
    field: responsible
    category: identifiant
    retention: >-
      Tant que l'événement existe (responsable d'une séquence du programme du
      jour J, lot 30b, CHR-06 : un prénom ou un rôle, « Camille », « Le
      domaine »). Après suppression ou demande d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Trouvé par la recherche RGPD-01 ; la ligne du programme est supprimée lors
      d'une demande d'oubli qui la vise (RGPD-03), comme sa note interne.
  - schema: events
    table: program_versions
    field: items
    category: contenu_libre
    retention: >-
      Lot 37b (CHR-07, DAT-14, D8) : copie figée des séquences du programme à chaque diffusion
      (heures, intitulés, lieux, responsables, intervenants), sans note interne ; lue par les
      clients et les prestataires de l'événement par leur lien. Un responsable ou un intervenant
      libre peut nommer une personne. Tant que l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Trouvée par la recherche RGPD-01 (responsables et intervenants libres) ; la version est
      supprimée lors d'une demande d'oubli qui la vise (pas d'anonymisation partielle d'une version
      figée), et avec l'événement.
  - schema: events
    table: event_client_accesses
    field: email
    category: contact
    retention: >-
      Table retirée au lot 26a (migration 0112, ADR 0053) : les invitations des
      comptes de mariés (ADR 0020) sont remplacées par les liens personnels
      (events.event_links). Entrée gardée parce que la migration 0026 qui l'a
      créée reste dans l'historique.
    anonymization: >-
      Sans objet depuis le lot 26a (table supprimée, données fictives seulement).
  - schema: events
    table: event_links
    field: person_name
    category: identifiant
    retention: >-
      Lot 26a (UX-11, POR-01, ADR 0053) : nom de la personne d'un lien personnel
      (client, parent payeur ; prestataire depuis le lot 26b), affiché à la
      planner, dans le portail ou l'espace du prestataire ; tant que le lien
      existe, purgé avec l'événement. Après suppression ou demande
      d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Le lien (et ses sessions et codes à usage unique) est supprimé lors d'une
      demande d'oubli qui le vise (RGPD-03) ; ses coches du fil d'activité
      perdent leur auteur.
  - schema: events
    table: event_links
    field: email
    category: contact
    retention: >-
      Lot 26a : adresse où le lien personnel est envoyé, et qui reconnaît les
      devis à signer de la personne ; lot 26b : le code à usage unique y part
      (seul son haché est gardé, dans events.event_link_codes, sans donnée
      personnelle, effacé sous un jour). Tant que le lien existe, purgée avec
      l'événement. Après suppression ou demande d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Le lien est supprimé lors d'une demande d'oubli qui le vise (RGPD-03).
  - schema: events
    table: event_decisions
    field: decided_by_name
    category: identifiant
    retention: >-
      Lot 27b (POR-03, BUD-07, EVT-09) : nom de la personne qui a répondu à une
      décision, copié à la réponse (la décision est nominative et ne se modifie
      plus), tant que l'événement existe ; purgé avec lui. Après demande
      d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par « [anonymisé] » avec la suppression du lien de la personne
      (RGPD-03) ; la décision reste, sans auteur.
  - schema: events
    table: event_decisions
    field: comment
    category: contenu_libre
    retention: >-
      Lot 27b : commentaire libre du client sur sa réponse, lisible des deux
      côtés, tant que l'événement existe.
    anonymization: >-
      Remplacé par « [anonymisé] » avec le nom de la personne (RGPD-03).
  - schema: events
    table: event_decisions
    field: note
    category: contenu_libre
    retention: >-
      Lot 27b : message libre de la planner joint à la demande de décision, tant
      que l'événement existe ; purgé avec lui.
    anonymization: >-
      Purgé avec l'événement ; une demande d'oubli vise le client, pas ce
      message de la planner.
  - schema: budget
    table: budget_lines
    field: label
    category: contenu_libre
    retention: >-
      Lot 28b (BUD-01, Q33) : libellé libre d'une ligne de budget (« Robe de
      Léa »), tant que la ligne existe. Après suppression ou demande d'oubli :
      voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli (RGPD-03) ; les
      montants restent pour les totaux.
  - schema: budget
    table: vendor_payments
    field: label
    category: contenu_libre
    retention: >-
      Lot 28b (BUD-03) : libellé libre d'une échéance due à un prestataire
      (« Acompte du traiteur »), tant que la ligne existe. Après suppression ou
      demande d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli (RGPD-03) ; le
      montant et les dates restent.
  - schema: budget
    table: vendor_payments
    field: refusal_reason
    category: contenu_libre
    retention: >-
      Lot 27a (SC-06, décision D6) : motif libre écrit par la planner quand elle
      refuse un règlement déclaré par un client, montré à ce client, jusqu'à la
      déclaration suivante. Après suppression ou demande d'oubli : voir
      RGPD-03/RGPD-05.
    anonymization: >-
      Effacé avec le libellé de l'échéance lors d'une demande d'oubli (RGPD-03).
  # Lot 51 (JRJ-05 à JRJ-09, PAR-08 ; ADR 0091, DPO-9) : le jour J de terrain.
  - schema: events
    table: day_incidents
    field: body
    category: contenu_libre
    retention: >-
      Lot 51 (JRJ-07) : incident noté (dicté) le jour J par un membre de l'équipe, interne à
      l'organisation ; ni nom d'invité ni donnée de santé (l'aide le rappelle). Tant que
      l'évènement existe ; purgé avec lui (corbeille, durée de conservation des évènements).
    anonymization: >-
      Supprimé avec l'évènement, ou lors d'une demande d'oubli qui vise l'évènement (RGPD-03).
  - schema: events
    table: day_photos
    field: storage_key
    category: contenu_libre
    retention: >-
      Lot 51 (JRJ-06, JRJ-07, JRJ-09 ; DPO-9) : photo d'un incident, d'une case ou d'un reçu, prise
      sur le lieu (des invités peuvent y apparaître ; l'écran conseille de photographier les choses).
      Interne à l'organisation, jamais montrée aux clients ni aux prestataires ; purgée avec les
      documents de l'évènement.
    anonymization: >-
      Fichier et ligne supprimés avec l'évènement, ou lors d'une demande d'oubli qui vise
      l'évènement (RGPD-03).
  - schema: events
    table: day_checkpoints
    field: user_id
    category: identifiant
    retention: >-
      Lot 51 (JRJ-05, JRJ-08) : membre de l'équipe qui a pointé une séquence (identifiant, jamais
      son nom). Tant que l'évènement existe.
    anonymization: >-
      Supprimé avec l'évènement ; l'identifiant d'un compte supprimé ne désigne plus personne.
  - schema: events
    table: day_incidents
    field: user_id
    category: identifiant
    retention: >-
      Lot 51 (JRJ-07) : membre de l'équipe qui a noté l'incident (identifiant). Tant que l'évènement
      existe.
    anonymization: >-
      Supprimé avec l'incident.
  - schema: events
    table: day_photos
    field: taken_by
    category: identifiant
    retention: >-
      Lot 51 : membre de l'équipe qui a pris la photo (identifiant). Tant que la photo existe.
    anonymization: >-
      Supprimé avec la photo.
  - schema: events
    table: day_shifts
    field: validated_by
    category: identifiant
    retention: >-
      Lot 51 (JRJ-05) : membre de l'équipe qui a validé un décalage (identifiant). Tant que
      l'évènement existe.
    anonymization: >-
      Supprimé avec l'évènement.
  - schema: events
    table: day_checklist_items
    field: checked_by
    category: identifiant
    retention: >-
      Lot 51 (JRJ-06) : membre de l'équipe qui a coché la case (identifiant). Tant que la liste
      existe.
    anonymization: >-
      Supprimé avec la liste.
  - schema: events
    table: day_checklist_items
    field: label
    category: contenu_libre
    retention: >-
      Lot 51 (JRJ-06) : intitulé libre d'une case (copié d'un modèle ou saisi). Tant que la liste
      existe.
    anonymization: >-
      Supprimé avec la liste, ou lors d'une demande d'oubli qui vise l'évènement (RGPD-03).
  - schema: events
    table: day_reports
    field: summary
    category: contenu_libre
    retention: >-
      Lot 51 (PAR-08, étape 7) : bilan du lendemain, qui recopie les incidents notés ; interne à
      l'organisation. Refait tant que des actions arrivent ; supprimé avec l'évènement.
    anonymization: >-
      Supprimé avec l'évènement, ou lors d'une demande d'oubli qui vise l'évènement (RGPD-03).
  - schema: budget
    table: vendor_payments
    field: handover_by
    category: contenu_libre
    retention: >-
      Lot 51 (JRJ-09) : personne qui remet un paiement le jour J (nom saisi par la planner). Tant
      que l'échéance existe.
    anonymization: >-
      Effacé avec le libellé de l'échéance lors d'une demande d'oubli (RGPD-03).
  - schema: budget
    table: vendor_payments
    field: handed_over_by
    category: identifiant
    retention: >-
      Lot 51 (JRJ-09) : membre de l'équipe qui a pointé la remise (identifiant). Tant que
      l'échéance existe.
    anonymization: >-
      Gardé (preuve du règlement) ; l'identifiant d'un compte supprimé ne désigne plus personne.
  - schema: budget
    table: event_payers
    field: name
    category: identifiant
    retention: >-
      Lot 43 (BUD-06, D8) : nom d'un payeur de l'évènement (« Famille Martin », « Société Durand »),
      saisi par la planner, tant que l'évènement existe. Après suppression ou demande d'oubli : voir
      RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli (RGPD-03) ; ses parts et ses échéances
      restent, sans nom.
  - schema: events
    table: event_day_contacts
    field: name
    category: identifiant
    retention: >-
      Lot 30a (JRJ-03) : contact du jour J saisi pour l'événement — nom de la personne ou du service (« Régisseur du domaine », « Taxi Dupont »).
      Copié sur le téléphone de la planner avec l'écran du jour J, effacé de
      l'appareil le lendemain de l'événement (ADR 0064). Tant que l'événement
      existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Le contact est supprimé lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: event_day_contacts
    field: role
    category: contenu_libre
    retention: >-
      Lot 30a (JRJ-03) : contact du jour J saisi pour l'événement — rôle saisi par la planner (« régisseur », « taxi »).
      Copié sur le téléphone de la planner avec l'écran du jour J, effacé de
      l'appareil le lendemain de l'événement (ADR 0064). Tant que l'événement
      existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Le contact est supprimé lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: event_day_contacts
    field: phone
    category: contact
    retention: >-
      Lot 30a (JRJ-03) : contact du jour J saisi pour l'événement — téléphone, pour l'appel ou le SMS en un toucher le jour J.
      Copié sur le téléphone de la planner avec l'écran du jour J, effacé de
      l'appareil le lendemain de l'événement (ADR 0064). Tant que l'événement
      existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Le contact est supprimé lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: event_documents
    field: label
    category: contenu_libre
    retention: >-
      Lot 29b (JRJ-04) : intitulé d'un document de l'événement (« Plan de table
      Martin ») saisi par la planner ; trouvé par la recherche RGPD. Tant que
      l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Supprimé avec le document lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: event_documents
    field: file_key
    category: contenu_libre
    retention: >-
      Lot 29b (JRJ-04) : plan de table, plans, plan B, stockés en privé ; le
      fichier peut nommer des invités ou les clients. Son contenu n'est pas
      indexé : il n'entre pas dans la recherche RGPD par terme (l'intitulé, si).
      Copié sur le téléphone de la planner s'il est embarqué pour le jour J,
      effacé de l'appareil le lendemain de l'événement (ADR 0064). Tant que
      l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Le document est supprimé du stockage avec sa ligne (pas d'anonymisation
      partielle d'un PDF ou d'une image), ainsi que son choix pour le jour J.
      Lot 37a : avec toutes ses versions, ses liens de partage et leurs ouvertures au fil d'activité.
  - schema: events
    table: event_document_versions
    field: file_key
    category: contenu_libre
    retention: >-
      Lot 37a (DOC-01, D4) : versions précédentes d'un document de l'événement, stockées en privé,
      consultables par l'équipe ; la dernière est recopiée sur le document. Le fichier peut nommer
      des invités ou les clients. Tant que le document existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Supprimées du stockage avec le document lors d'une demande d'oubli qui le vise (pas
      d'anonymisation partielle d'un fichier).
  - schema: events
    table: event_document_folders
    field: name
    category: contenu_libre
    retention: >-
      Lot 37a (DOC-01, D3) : nom d'un dossier de documents saisi par l'équipe (« Traiteur »,
      « Famille Martin ») ; trouvé par la recherche RGPD. Tant que l'événement existe ; voir
      RGPD-03/RGPD-05.
    anonymization: >-
      Le dossier est supprimé lors d'une demande d'oubli qui le vise ; ses documents vont dans
      « Divers ».
  - schema: events
    table: event_activities
    field: task_label
    category: contenu_libre
    retention: >-
      Fil d'activité de l'événement : intitulé de la tâche cochée ou de la décision ; lot 37a
      (DOC-04, D7) : intitulé du document dont un lien de partage a été ouvert, copié à
      l'ouverture. Tant que l'événement existe.
    anonymization: >-
      Le fil est supprimé avec l'oubli de l'événement ; les ouvertures d'un document partent avec
      l'oubli du document.
  - schema: budget
    table: budget_line_attachments
    field: file_key
    category: contenu_libre
    retention: >-
      Tant que la ligne de budget existe (PRD-BUD-03 : devis d'un prestataire,
      stocké en privé ; le document peut nommer un prestataire indépendant,
      donc une personne). Le contenu du fichier n'est pas indexé : il n'entre
      pas dans la recherche RGPD par terme. Après suppression ou demande
      d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Le document est supprimé du stockage (pas d'anonymisation partielle
      d'un PDF ou d'une image) ; la ligne de budget reste.
  - schema: quotes
    table: quote_lines
    field: description
    category: contenu_libre
    retention: >-
      Tant que le devis existe (DEV-01 : précision libre d'une ligne, qui
      peut nommer un marié ou un prestataire). Un devis envoyé est figé ;
      après suppression ou demande d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli (RGPD-03), sauf sur un
      devis signé (preuve du contrat) ; les montants, l'intitulé et la numérotation
      restent.
  - schema: quotes
    table: quote_versions
    field: options_chosen_by
    category: identifiant
    retention: >-
      Nom de qui a choisi les options d'un devis envoyé (lot 31a, FAC-01 : le
      client sur son portail, ou la planner pour lui), avec la date du choix.
      Conservé avec la version du devis ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Trouvé par la recherche RGPD-01 ; remplacé par « [anonymisé] » lors d'une
      demande d'oubli (RGPD-03), sauf sur un devis signé tant que court la preuve
      du contrat.
  - schema: quotes
    table: contracts
    field: clauses
    category: contenu_libre
    retention: >-
      Texte figé d'un contrat généré (lot 31b, FAC-04 : clauses du modèle dont les
      variables sont résolues, dont les noms des clients et le lieu de
      l'événement). Conservé avec le devis ; un contrat signé est une preuve du
      contrat, gardée dix ans par défaut (réponse 3 de l'avocat, D16).
    anonymization: >-
      Trouvé par la recherche RGPD-01 ; le texte des clauses est remplacé par
      « [anonymisé] » lors d'une demande d'oubli (RGPD-03), sauf sur un devis
      signé tant que court la preuve du contrat.
  - schema: quotes
    table: contract_signer_acts
    field: signer_name
    category: identifiant
    retention: >-
      Nom du signataire qui a commandé (contrat à distance) ou demandé
      l'exécution avant la fin du délai de rétractation (lot 31b, JUR-07), avec
      la date et le texte présenté. Preuve du contrat, même durée que le devis
      signé.
    anonymization: >-
      Trouvé par la recherche RGPD-01 ; remplacé par « [anonymisé] » lors d'une
      demande d'oubli (RGPD-03), sauf tant que court la preuve du contrat.
  - schema: quotes
    table: contract_evidence
    field: document_key
    category: identifiant
    retention: >-
      Clé du dossier de preuve de Symbola (lot 31b), fichier JSON privé qui
      reprend les noms et e-mails des signataires, leurs actes et les empreintes
      des documents signés. Même durée que le devis signé (dix ans par défaut).
    anonymization: >-
      Fichier retiré du stockage et ligne supprimée à la fin de la preuve du
      contrat (RGPD-05) ; jamais modifié avant.
  - schema: quotes
    table: quote_versions
    field: seller_snapshot
    category: contact
    retention: >-
      Copie figée à l'envoi de l'en-tête vendeur (DEV-01, ONB-02 : nom,
      adresse et SIREN de l'organisation, l'adresse pouvant être celle
      d'une entrepreneuse individuelle ; depuis le lot 17, DEV-07 et
      DEV-11 : aussi e-mail et téléphone de contact, IBAN et apparence du
      document). Conservée avec la version envoyée du devis ; voir
      RGPD-03/RGPD-05.
    anonymization: >-
      L'adresse est remplacée par « [anonymisé] » lors d'une demande
      d'oubli de l'organisation (RGPD-03), sauf obligation légale de
      conservation (factures, lot 4).
  - schema: quotes
    table: payment_references
    field: declared_by_name
    category: identifiant
    retention: >-
      Lot 43 (FAC-08, ADR 0087) : nom copié de la personne qui déclare, depuis son lien, avoir fait le
      virement d'une échéance, montré à la planner jusqu'à sa confirmation, gardé ensuite avec
      l'échéance. Voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli (RGPD-03) ; la date déclarée et
      l'encaissement confirmé restent, sans nom.
  - schema: quotes
    table: payment_references
    field: reminders_suspension_reason
    category: contenu_libre
    retention: >-
      Lot 43 (FAC-09, D7) : motif libre écrit par la planner quand elle suspend les relances d'une
      échéance (« arrangement avec le client »), tant que l'échéance existe. Voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli (RGPD-03).
  - schema: quotes
    table: quote_versions
    field: proposal_greeting
    category: contenu_libre
    retention: >-
      Lot 43 (FAC-02, D2) : mot d'accueil de la page de proposition, écrit par la planner (il peut
      nommer le client), figé avec la version envoyée, tant que le devis existe.
    anonymization: >-
      Suit le devis : effacé avec lui ; sur un devis signé, gardé comme le reste de la version
      (preuve du contrat), puis effacé avec le devis.
  - schema: quotes
    table: proposal_templates
    field: greeting
    category: contenu_libre
    retention: >-
      Lot 43 (FAC-02, D2) : mot d'accueil du modèle de proposition de l'organisation, sans donnée d'un
      client attendue, tant que le modèle existe.
    anonymization: >-
      Supprimé avec le modèle.
  - schema: quotes
    table: quote_signers
    field: name
    category: identifiant
    retention: >-
      Tant que le devis existe (DEV-02 : signataire saisi sur le devis, copie
      figée avec la version envoyée en signature). Voir RGPD-03/RGPD-05 ; un
      devis signé lié à une facture suit la conservation légale de celle-ci.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli (RGPD-03), sauf sur un
      devis signé, conservé comme preuve du contrat (5 ans par défaut, réglage de
      l'organisation) puis anonymisé par la purge (RGPD-05).
  - schema: quotes
    table: quote_signers
    field: email
    category: contact
    retention: >-
      Tant que le devis existe (DEV-02 : adresse à laquelle Symbola envoie le
      lien de signature). Voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par une valeur générée non réversible lors d'une demande d'oubli
      (RGPD-03), sauf sur un devis signé (preuve du contrat, même durée).
  - schema: quotes
    table: quotes
    field: delivery_address
    category: contact
    retention: >-
      Lot 41 (JUR-02, D6) : adresse de livraison des biens, si elle diffère de l'adresse de
      facturation (lieu de réception ou domicile d'un client). Tant que le devis existe ; chaque
      facture en garde la copie (invoices.reform_snapshot).
    anonymization: >-
      Effacée avec les autres données du devis lors d'une demande d'oubli (RGPD-03) ; les factures
      émises gardent leur copie jusqu'à la fin de la conservation légale.
  - schema: quotes
    table: quotes
    field: client_order_reference
    category: identifiant
    retention: >-
      Lot 41 (JUR-13, D8) : numéro de bon de commande d'une entreprise cliente, saisi par la planner
      ou par le signataire depuis son lien. Donnée de l'entreprise, sans nom de personne attendu ;
      tant que le devis existe.
    anonymization: >-
      Effacé avec les autres données du devis lors d'une demande d'oubli (RGPD-03).
  - schema: quotes
    table: quotes
    field: buyer_reference
    category: identifiant
    retention: >-
      Lot 41 (JUR-13, D8) : référence de l'acheteur (code service, référence interne de l'entreprise
      cliente) ; peut nommer une personne du service achats. Tant que le devis existe.
    anonymization: >-
      Effacée avec les autres données du devis lors d'une demande d'oubli (RGPD-03).
  - schema: quotes
    table: quote_signers
    field: billing_address
    category: contact
    retention: >-
      Tant que le devis existe (DEV-02 : adresse de facturation reprise sur
      les factures, DEV-04). Voir RGPD-03/RGPD-05 ; conservation légale des
      factures émises.
    anonymization: >-
      Remplacée par « [anonymisé] » lors d'une demande d'oubli (RGPD-03), sauf sur
      un devis signé (preuve du contrat) ; jamais modifiée sur une facture émise
      (conservation légale).
  - schema: quotes
    table: quote_signers
    field: signing_url
    category: securite
    retention: >-
      Tant que le devis existe (DEV-02 : lien personnel de signature chez le
      fournisseur, affiché à la planner et au marié concerné uniquement).
    anonymization: >-
      Supprimé (remplacé par une valeur vide) lors d'une demande d'oubli ;
      le lien ne sert plus une fois la demande terminée.
  - schema: quotes
    table: invoices
    field: buyer_snapshot
    category: contact
    retention: >-
      Conservation légale des factures (DEV-04 : nom et adresse de
      facturation des acheteurs, copiés et figés à l'émission ; 10 ans,
      code de commerce — à confirmer avec le comptable). Une demande d'oubli
      n'efface pas une facture émise : elle est signalée « conservation
      légale » dans le suivi RGPD (RGPD-03).
    anonymization: >-
      Aucune avant la fin de la conservation légale (facture immuable) ;
      suppression à son terme (RGPD-05).
  - schema: quotes
    table: invoices
    field: reform_snapshot
    category: contact
    retention: >-
      Lot 41 (FAC-10, JUR-02, JUR-13) : copie figée des mentions de la réforme, dont l'adresse de
      livraison (lieu de l'évènement ou domicile d'un client, si elle diffère de l'adresse de
      facturation) et le numéro de bon de commande et la référence de l'acheteur (données d'une
      entreprise). Conservation légale des factures, comme buyer_snapshot ; aussi dans le fichier
      Factur-X de l'original. L'acheteur entreprise (raison sociale, SIREN, TVA, adresse) est dans
      buyer_snapshot.
    anonymization: >-
      Aucune avant la fin de la conservation légale ; à son terme, l'adresse de livraison est
      retirée dans la même transaction que l'acheteur (RGPD-05, déclencheur
      forbid_issued_document_change). L'original Factur-X suit la purge des originaux.
  - schema: quotes
    table: credit_notes
    field: reform_snapshot
    category: contact
    retention: >-
      Lot 41 (FAC-10) : copie de la réforme de la facture corrigée. Conservation légale, comme
      invoices.reform_snapshot.
    anonymization: >-
      Comme invoices.reform_snapshot.
  - schema: quotes
    table: invoices
    field: seller_snapshot
    category: contact
    retention: >-
      Conservation légale des factures (DEV-04 : en-tête vendeur figé à
      l'émission, l'adresse pouvant être celle d'une entrepreneuse
      individuelle ; depuis le lot 17 : aussi e-mail et téléphone de
      contact, IBAN et apparence du document). Voir invoices.buyer_snapshot.
    anonymization: >-
      Aucune avant la fin de la conservation légale (facture immuable).
  - schema: quotes
    table: credit_notes
    field: buyer_snapshot
    category: contact
    retention: >-
      Conservation légale, comme la facture corrigée (DEV-04).
    anonymization: >-
      Aucune avant la fin de la conservation légale (avoir immuable).
  - schema: quotes
    table: credit_notes
    field: seller_snapshot
    category: contact
    retention: >-
      Conservation légale, comme la facture corrigée (DEV-04).
    anonymization: >-
      Aucune avant la fin de la conservation légale (avoir immuable).
  - schema: quotes
    table: earnest_receipts
    field: buyer_snapshot
    category: contact
    retention: >-
      Reçu non fiscal remis à l'encaissement d'arrhes (lot 31c, JUR-08) : noms et
      adresses de facturation des clients, figés. Même conservation que les pièces
      comptables (dix ans par défaut), à compter de la date du reçu.
    anonymization: >-
      Aucune avant la fin de la conservation (reçu immuable) ; ensuite, les noms et
      adresses sont remplacés (oubli ou purge mensuelle), le montant et la date restent.
  - schema: quotes
    table: earnest_receipts
    field: seller_snapshot
    category: contact
    retention: >-
      Coordonnées du vendeur figées sur le reçu d'arrhes (lot 31c), comme sur une
      facture. Même conservation que les pièces comptables.
    anonymization: >-
      Aucune avant la fin de la conservation (reçu immuable).
  - schema: vendors
    table: vendors
    field: name
    category: identifiant
    retention: >-
      Lot 11 (ADR 0031) : le nom d'un prestataire indépendant est une personne. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: contact_name
    category: identifiant
    retention: >-
      Lot 11 (ADR 0031) : nom du contact chez le prestataire. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: email
    category: contact
    retention: >-
      Lot 11 (ADR 0031) : e-mail du prestataire ou de son contact. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: phone
    category: contact
    retention: >-
      Lot 11 (ADR 0031) : téléphone du prestataire ou de son contact. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: address_line
    category: contact
    retention: >-
      Lot 11 (ADR 0031) : adresse (celle d'un indépendant peut être son domicile). Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: postal_code
    category: contact
    retention: >-
      Lot 11 (ADR 0031) : code postal de l'adresse. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: internal_note
    category: contenu_libre
    retention: >-
      Lot 11 (ADR 0031) : note interne de l'équipe. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: rating
    category: contenu_libre
    retention: >-
      Lot 28c (PRE-01, D8) : évaluation interne de l'équipe (1 à 5), jamais montrée hors de l'organisation. Tant que la fiche existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : effacée avec la note interne ; exportée avec la fiche (RGPD-02).
  - schema: vendors
    table: vendors
    field: indicative_prices
    category: contenu_libre
    retention: >-
      Lot 28c (PRE-01, D8) : tarifs indicatifs en texte libre, saisis par l'équipe. Tant que la fiche existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : effacés avec la note interne ; exportés avec la fiche (RGPD-02).
  - schema: vendors
    table: vendors
    field: field_values
    category: contenu_libre
    retention: >-
      Lot 11 (ADR 0031) : champs propres au type, saisis par l'équipe. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: website
    category: contact
    retention: >-
      Lot 14 (décision M) : site web du prestataire (celui d'un indépendant peut porter son nom). Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note, site, réseaux, SIRET, champs importés et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: social_links
    category: contact
    retention: >-
      Lot 14 (décision M) : liens vers les réseaux sociaux du prestataire. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note, site, réseaux, SIRET, champs importés et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: siret
    category: identifiant
    retention: >-
      Lot 14 (décision M) : SIRET (celui d'un entrepreneur individuel désigne une personne). Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note, site, réseaux, SIRET, champs importés et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: imported_fields
    category: contenu_libre
    retention: >-
      Lot 14 (IMP-07) : colonnes d'un import gardées telles quelles (TVA intracommunautaire, code APE, statut juridique…). Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note, site, réseaux, SIRET, champs importés et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendor_files
    field: file_key
    category: contenu_libre
    retention: >-
      Lot 11 (ADR 0031) : plaquette ou RIB (fichier privé). Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Supprimé, fichier compris, lors d'une demande d'oubli de la fiche (RGPD-03).
  - schema: events
    table: event_vendor_candidates
    field: vendor_name
    category: identifiant
    retention: >-
      Lot 11 (ADR 0031) : nom d'un prestataire consulté pour un poste. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli (RGPD-03) ; le devis joint, qui nomme le prestataire, est supprimé.
  - schema: events
    table: event_vendor_candidate_notes
    field: body
    category: contenu_libre
    retention: >-
      Lot 11 (ADR 0031) : note sur un prestataire consulté, parfois montrée aux clients. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Supprimée lors d'une demande d'oubli du consulté ou de l'événement (RGPD-03).
  - schema: events
    table: vendor_briefs
    field: need
    category: contenu_libre
    retention: >-
      Lot 47 (PRE-03, D1 ; ADR 0085) : le besoin d'un poste, envoyé aux prestataires consultés par leur lien. Tant que l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli du poste ou de l'événement (RGPD-03).
  - schema: events
    table: event_vendor_candidates
    field: answer_message
    category: contenu_libre
    retention: >-
      Lot 47 (PRE-04, D3 ; ADR 0085) : message court du prestataire avec sa réponse au brief. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Effacé (null) lors d'une demande d'oubli du consulté (RGPD-03), avec son nom et son devis.
  - schema: events
    table: event_decision_option_feedback
    field: comment
    category: contenu_libre
    retention: >-
      Lot 47 (PRE-09, D7 ; ADR 0085) : avis court du client sur une option proposée, par son lien. Tant que l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Supprimé avec l'avis lors d'une demande d'oubli du lien de la personne (RGPD-03).
  - schema: events
    table: vendor_scenarios
    field: name
    category: contenu_libre
    retention: >-
      Lot 47 (BUD-05, D5 ; ADR 0085) : nom court d'un scénario d'options, écrit par l'équipe. Tant que l'événement existe.
    anonymization: >-
      Supprimé avec l'événement (RGPD-03).
  - schema: events
    table: event_vendor_slots
    field: brief
    category: contenu_libre
    retention: >-
      Lot 11 (ADR 0031) : ce que veulent les clients pour un poste. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Effacé (null) lors d'une demande d'oubli de l'événement (RGPD-03).
  # Module Rendez-vous (lot 46, ADR 0082). Agendas extérieurs (D2, D4) : l'adresse secrète est
  # chiffrée (DAT-08, ADR 0079) ; seules les plages occupées (début, fin) en sont gardées
  # (appointments.busy_intervals), sans titre, lieu ni participant, remplacées à chaque lecture
  # (toutes les quinze minutes) et effacées avec la source. Elles disent quand la personne de
  # l'équipe est prise, rien de plus. La page de réservation (booking_pages) ne porte que son
  # adresse publique et la mention d'information, aucune donnée de personne.
  - schema: appointments
    table: appointments
    field: person_name
    category: identifiant
    retention: >-
      Lot 46 (RDV-02, RDV-03 ; ADR 0082) : figé à la réservation. Tant que le rendez-vous existe ; une personne qui a seulement pris rendez-vous, sans évènement, suit la règle des prospects (durée réglée après son dernier échange ; question DPO-2, défaut prudent) ; rattaché à un évènement, il suit l'évènement ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli ou de la purge (RGPD-03, RGPD-05) : nom remplacé par « [anonymisé] », e-mail, téléphone, réponses et jeton de gestion effacés, rattachement au contact retiré ; un rendez-vous à venir est annulé. Le rendez-vous reste (type, heure), sans personne.
  - schema: appointments
    table: appointments
    field: person_email
    category: contact
    retention: >-
      Lot 46 (RDV-02, RDV-03 ; ADR 0082) : figé à la réservation. Tant que le rendez-vous existe ; une personne qui a seulement pris rendez-vous, sans évènement, suit la règle des prospects (durée réglée après son dernier échange ; question DPO-2, défaut prudent) ; rattaché à un évènement, il suit l'évènement ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli ou de la purge (RGPD-03, RGPD-05) : nom remplacé par « [anonymisé] », e-mail, téléphone, réponses et jeton de gestion effacés, rattachement au contact retiré ; un rendez-vous à venir est annulé. Le rendez-vous reste (type, heure), sans personne.
  - schema: appointments
    table: appointments
    field: person_phone
    category: contact
    retention: >-
      Lot 46 (RDV-02, RDV-03 ; ADR 0082) : figé à la réservation. Tant que le rendez-vous existe ; une personne qui a seulement pris rendez-vous, sans évènement, suit la règle des prospects (durée réglée après son dernier échange ; question DPO-2, défaut prudent) ; rattaché à un évènement, il suit l'évènement ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli ou de la purge (RGPD-03, RGPD-05) : nom remplacé par « [anonymisé] », e-mail, téléphone, réponses et jeton de gestion effacés, rattachement au contact retiré ; un rendez-vous à venir est annulé. Le rendez-vous reste (type, heure), sans personne.
  - schema: appointments
    table: appointments
    field: answers
    category: contenu_libre
    retention: >-
      Lot 46 (RDV-01, RGP-04) : réponses aux questions préalables du type (zéro à cinq ; une réponse courte porte la mise en garde de RGP-04). Même durée que le rendez-vous ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli ou de la purge (RGPD-03, RGPD-05) : nom remplacé par « [anonymisé] », e-mail, téléphone, réponses et jeton de gestion effacés, rattachement au contact retiré ; un rendez-vous à venir est annulé. Le rendez-vous reste (type, heure), sans personne.
  - schema: appointments
    table: appointments
    field: manage_token_hash
    category: securite
    retention: >-
      Lot 46 (RDV-03, SEC-14) : empreinte SHA-256 du jeton du lien de gestion ; le lien cesse de fonctionner à la fin du rendez-vous.
    anonymization: >-
      Effacée à l'oubli ou à la purge ; le lien ne fonctionne plus.
  - schema: appointments
    table: appointments
    field: manage_token_sealed
    category: securite
    retention: >-
      Lot 46 (RDV-03, DAT-08) : le même jeton, chiffré (« f1: », ADR 0079), pour redonner le lien dans les rappels ; jamais affiché à l'équipe.
    anonymization: >-
      Effacé à l'oubli ou à la purge, avec l'empreinte.
  - schema: appointments
    table: appointment_reports
    field: notes
    category: contenu_libre
    retention: >-
      Lot 46 (EVT-10, RGP-04) : compte rendu d'un rendez-vous, réservé à l'équipe, jamais partagé au client. Même durée que le rendez-vous ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Effacé (null) à l'oubli ou à la purge du rendez-vous.
  - schema: appointments
    table: appointment_report_actions
    field: label
    category: contenu_libre
    retention: >-
      Lot 46 (EVT-10) : action tirée du compte rendu (quoi, pour quand, qui) ; une action devenue tâche vit aussi dans le rétroplanning de l'évènement. Supprimée avec le rendez-vous.
    anonymization: >-
      Supprimée avec le compte rendu (purge du rendez-vous) ; la tâche suit l'évènement.
  - schema: appointments
    table: availability_closures
    field: reason
    category: contenu_libre
    retention: >-
      Lot 46 : motif court d'un jour fermé (80 caractères), visible de l'équipe seulement. Tant que la personne le garde ; supprimé avec son compte.
    anonymization: >-
      Supprimé par la personne, ou avec les données de l'organisation.
  - schema: appointments
    table: calendar_sources
    field: url_sealed
    category: securite
    retention: >-
      Lot 46 (D2, DAT-08) : adresse secrète de l'agenda extérieur d'une personne de l'équipe, chiffrée au repos, jamais affichée après l'enregistrement ni écrite dans un journal. Tant que la personne garde l'agenda relié.
    anonymization: >-
      Supprimée quand la personne retire l'agenda, avec ses plages occupées.
  - schema: appointments
    table: calendar_sources
    field: url_hint
    category: identifiant
    retention: >-
      Lot 46 (D2) : hôte de l'adresse et ses quatre derniers caractères, pour reconnaître l'agenda. Même durée que l'adresse.
    anonymization: >-
      Supprimé avec l'agenda.
  # Lot 44 (CRM-01 ; D4, D5 ; ADR 0084) : demandes reçues par le formulaire de contact public. Le nom,
  # l'e-mail et le téléphone du prospect vont dans sa fiche de contact (hub.contacts, déjà déclarée) ;
  # la demande garde ce qui n'a pas sa place dans la fiche. Une demande « à vérifier » (message à liens)
  # garde ses champs reçus dans pending jusqu'à son acceptation, ou au plus 30 jours. Rien de
  # personnel dans le réglage du formulaire (events.contact_forms) ni dans les étapes du pipeline.
  - schema: events
    table: prospect_requests
    field: message
    category: contenu_libre
    retention: >-
      Lot 44 (CRM-01) : message libre écrit par le prospect, affiché tel quel sur la fiche de
      l'évènement ; suit la durée des prospects de l'organisation (purge avec l'évènement, RGPD-05).
      Demande « à vérifier » non traitée : effacée après 30 jours (contact-form.json).
    anonymization: >-
      Supprimée avec la demande lors d'une demande d'oubli (RGPD-03) ou de la purge de l'évènement.
  - schema: events
    table: prospect_requests
    field: period
    category: contenu_libre
    retention: >-
      Lot 44 (CRM-01) : période souhaitée en texte court (« au printemps 2028 »), comme le message.
    anonymization: >-
      Supprimée avec la demande (RGPD-03, RGPD-05).
  - schema: events
    table: prospect_requests
    field: budget_range
    category: contenu_libre
    retention: >-
      Lot 44 (CRM-01) : tranche de budget en texte court, quand le prospect ne donne pas un montant ;
      comme le message.
    anonymization: >-
      Supprimée avec la demande (RGPD-03, RGPD-05).
  - schema: events
    table: prospect_requests
    field: pending
    category: contact
    retention: >-
      Lot 44 (CRM-01, D4) : demande « à vérifier » seulement — prénom, nom, e-mail, téléphone, date,
      lieu, budget et invités reçus, en attente. Vidé à l'acceptation (ils passent au contact et à
      l'évènement) ; demande effacée après 30 jours si elle n'est pas traitée.
    anonymization: >-
      Supprimée avec la demande lors d'une demande d'oubli (RGPD-03).
  # Lot 45 (CRM-05, CRM-06, CRM-07, CRM-09, POR-07 ; ADR 0090). Les messages et relances rangés dans
  # l'historique d'un contact portent le texte envoyé ou préparé par la planner ; les réponses à un
  # questionnaire, le texte écrit par la personne sur son lien. Les modèles de questionnaires, le
  # réglage des relances, la copie figée des questions et la trace des fusions (identifiants et noms de
  # champs) ne portent rien de personnel. La fusion de deux fiches est un traitement de mise à jour
  # (hub.contacts) : aucune donnée nouvelle.
  - schema: events
    table: event_messages
    field: subject
    category: contenu_libre
    retention: >-
      Lot 45 (CRM-05, CRM-03) : objet d'un message envoyé ou préparé pour un contact de l'évènement,
      gardé dans l'historique du contact ; suit l'évènement (purge des prospects, RGPD-05).
    anonymization: >-
      Supprimé avec le message lors d'une demande d'oubli du contact (RGPD-03) ou de la purge de
      l'évènement.
  - schema: events
    table: event_messages
    field: body
    category: contenu_libre
    retention: >-
      Lot 45 (CRM-05, CRM-03) : texte d'un message, relu et modifié par la planner avant l'envoi,
      gardé dans l'historique du contact ; suit l'évènement.
    anonymization: >-
      Supprimé avec le message (RGPD-03, RGPD-05).
  - schema: events
    table: prospect_follow_ups
    field: subject
    category: contenu_libre
    retention: >-
      Lot 45 (CRM-06) : objet d'une relance préparée, relu par la planner avant l'envoi ; suit
      l'évènement.
    anonymization: >-
      Supprimé avec la relance (RGPD-03, RGPD-05).
  - schema: events
    table: prospect_follow_ups
    field: body
    category: contenu_libre
    retention: >-
      Lot 45 (CRM-06) : texte d'une relance préparée, relu et modifié par la planner ; suit
      l'évènement.
    anonymization: >-
      Supprimé avec la relance (RGPD-03, RGPD-05).
  - schema: events
    table: questionnaire_answers
    field: value
    category: contenu_libre
    retention: >-
      Lot 45 (POR-07, CRM-09) : réponse d'un contact à un questionnaire (date, nombre d'invités,
      budget, lieu, musiques, détails pratiques…), écrite sur son lien personnel ; les réponses liées
      à un champ remplissent l'évènement. Aucune question de départ sur la santé, la religion ou les
      opinions ; une telle question écrite par la planner reçoit un avertissement (renvoi au module
      Invités). Suit l'évènement.
    anonymization: >-
      Supprimée avec le questionnaire lors d'une demande d'oubli du contact (RGPD-03) ou de la purge
      de l'évènement.
  - schema: core
    table: rate_limit_events
    field: key_hash
    category: securite
    retention: >-
      Lot 16 (L16-SEC-02, ADR 0044) : empreinte SHA-256 de l'adresse IP, de l'e-mail
      saisi ou de l'identifiant du compte, pour une tentative de connexion, de
      double authentification, de mot de passe oublié, de recherche ou d'envoi
      de fichier. Jamais la valeur en clair. Gardée un jour au plus (purge
      horaire), au titre de la sécurité du service.
    anonymization: >-
      Supprimée par la purge horaire ; rien à anonymiser au-delà.
  - schema: core
    table: audit_entries
    field: actor_id
    category: securite
    retention: >-
      Lot 23 (SEC-19, ARC-16, ADR 0060) : identifiant du compte auteur d'un geste
      sensible (connexion, droits, export, partage, émission, encaissement,
      suppression). Jamais de nom ni d'e-mail dans le journal. Journal en ajout
      seul : gardé, durée à fixer avec le DPO (fiche, question 11) puis purgé au
      lot 34 ; d'ici là, rien n'est purgé sauf les lignes d'un essai guidé.
    anonymization: >-
      Une fois le compte supprimé ou anonymisé, l'identifiant ne désigne plus
      personne. L'export RGPD des lignes qui concernent une personne reste à
      faire (bilan du lot 23).
  - schema: hub
    table: connection_traces
    field: ip
    category: securite
    retention: >-
      Lot 23 (SEC-19, décision D5, ADR 0060) : adresse IP d'une connexion, d'un
      échec ou d'un verrouillage, à part du journal d'audit. Illisible par l'app
      (droit d'écriture seul) ; lue seulement par un accès d'exploitation tracé
      (SEC-09). Purgée chaque jour passé
      platform_settings.connection_trace_retention_months (12 mois par défaut, à
      confirmer par le DPO, fiche question 11).
    anonymization: >-
      Supprimée par la purge quotidienne ; rien à anonymiser au-delà.
  - schema: quotes
    table: payment_entries
    field: reason
    category: contenu_libre
    retention: >-
      Lot 23b (JUR-05, décision D2, ADR 0061) : motif saisi par la planner quand elle
      annule un encaissement (écriture inverse, en ajout seul). Texte libre, qui peut
      citer une personne ; la chaîne des pièces n'en garde que l'empreinte. Conservé
      avec les pièces comptables (dix ans, JUR-06).
    anonymization: >-
      Écriture en ajout seul, conservée comme pièce comptable : pas d'effacement avant
      la fin de la conservation comptable ; l'aide invite à ne citer personne.
  - schema: events
    table: event_task_comments
    field: body
    category: contenu_libre
    retention: >-
      Lot 34b (CHR-02, D13) : commentaire d'une tâche, lu et écrit par l'équipe seulement ; trouvé
      par la recherche RGPD. Tant que l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Supprimé lors d'une demande d'oubli qui le vise ou qui vise l'événement (RGPD-03).
  - schema: events
    table: event_task_comments
    field: author_user_id
    category: identifiant
    retention: >-
      Lot 34b (CHR-02, D13) : compte de l'équipe auteur du commentaire (identifiant, sans nom ni
      e-mail dans la table). Tant que le commentaire existe.
    anonymization: >-
      Supprimé avec le commentaire (RGPD-03).
  - schema: events
    table: event_task_attachments
    field: label
    category: contenu_libre
    retention: >-
      Lot 34b (CHR-02, D13) : intitulé d'une pièce jointe de tâche, trouvé par la recherche RGPD.
      Tant que l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Supprimé avec la pièce jointe lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: event_task_attachments
    field: file_key
    category: contenu_libre
    retention: >-
      Lot 34b (CHR-02, D13) : fichier joint à une tâche, stocké en privé, réservé à l'équipe ; il
      peut nommer des personnes. Son contenu n'est pas indexé (l'intitulé, si). Tant que
      l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Supprimé du stockage avec sa ligne lors d'une demande d'oubli qui le vise, qui vise sa tâche
      ou l'événement (pas d'anonymisation partielle d'un fichier).
  - schema: hub
    table: form_drafts
    field: content
    category: contenu_libre
    retention: >-
      Lot 39b (UX-09, D7, ADR 0074) : brouillon de saisie d'une personne de l'équipe (nouvel
      évènement, contact, note, ligne de devis, modèle), qui peut nommer des personnes. Effacé
      quand le formulaire est enregistré ; sinon purgé 30 jours après la dernière frappe. Une
      copie peut rester dans le navigateur de l'appareil tant qu'elle n'a pas été envoyée (coupure
      réseau) ; elle s'efface quand le brouillon est enregistré ou effacé.
    anonymization: >-
      Supprimé lors d'une demande d'oubli qui le vise, à la purge, ou avec le compte de son auteur.
  - schema: hub
    table: jobs
    field: payload
    category: contenu_libre
    retention: >-
      Lot 40b (ARC-10, D9, ADR 0076) : e-mail à envoyer (destinataire, sujet, texte, pièces
      jointes), le temps de son envoi : tenté aussitôt, repris au plus cinq fois en une heure et
      demie environ. Effacé dès la fin de la tâche, réussie, échouée ou interrompue ; la ligne garde
      le genre, l'état et les dates 30 jours, sans contenu.
    anonymization: >-
      Supprimé lors d'une demande d'oubli qui le vise (l'e-mail ne part pas), ou à la fin de la
      tâche.
  # Lot 49 (module Invités ; INV-01 à INV-04, INV-07, RGP-06 à RGP-08, RGP-18 ; ADR 0083). Base
  # légale : intérêt légitime du planner et du couple (réponse 2 de la DPO), information de l'invité
  # au premier contact (article 14) et droit d'opposition ; régimes et allergies : accord de
  # l'invité lui-même (article 9, réponse 3). Purge automatique après le dernier jour de
  # l'évènement (ou son annulation) : régimes à 7 jours, le reste à 30 jours (hub.privacy_settings),
  # préavis de 7 jours, un seul report motivé de 90 jours au plus. Les invités ne sont pas des
  # contacts du hub (CRM-03). Aucune donnée d'invité dans les copies hors ligne du jour J (lot 29).
  - schema: guests
    table: guests
    field: first_name
    category: identifiant
    retention: >-
      Lot 49 (INV-01, RGP-18) : prénom d'un invité (adulte ou enfant), saisi par la planner, par le
      client à son portail ou importé d'un tableur. Purgé 30 jours après le dernier jour de
      l'évènement (RGP-08) ; gardé, avec le nom, en cas d'opposition jusqu'à la purge (DPO-3).
    anonymization: >-
      Supprimé avec la personne : effacement demandé à la planner (RGPD-03), purge de l'évènement,
      annulation de l'import qui l'a créé.
  - schema: guests
    table: guests
    field: last_name
    category: identifiant
    retention: >-
      Lot 49 (INV-01) : nom de famille d'un adulte invité (jamais d'un enfant : contrainte en base,
      RGP-18). Même durée que le prénom.
    anonymization: >-
      Supprimé avec la personne (RGPD-03, purge RGP-08).
  - schema: guests
    table: guests
    field: email
    category: contact
    retention: >-
      Lot 49 (INV-01, INV-03, INV-04) : adresse e-mail d'un adulte invité (jamais d'un enfant :
      contrainte en base, RGP-18), pour l'invitation et les relances. Effacée aussitôt à
      l'opposition de l'invité ; sinon purgée 30 jours après l'évènement.
    anonymization: >-
      Mise à null à l'opposition (lien « Je ne souhaite pas que mes données soient conservées ») ;
      supprimée avec la personne (RGPD-03, RGP-08).
  - schema: guests
    table: guests
    field: phone
    category: contact
    retention: >-
      Lot 49 (INV-01) : téléphone d'un adulte invité (jamais d'un enfant), pour une relance à la
      main ou un lien envoyé par SMS par le client. Même règle que l'adresse e-mail.
    anonymization: >-
      Mis à null à l'opposition ; supprimé avec la personne (RGPD-03, RGP-08).
  - schema: guests
    table: guests
    field: age_range
    category: identifiant
    retention: >-
      Lot 49 (RGP-18) : tranche d'âge d'un enfant (0-2, 3-5, 6-11, 12-17), jamais sa date de
      naissance. Purgée avec la personne, 30 jours après l'évènement.
    anonymization: >-
      Supprimée avec la personne (RGPD-03, RGP-08).
  - schema: guests
    table: households
    field: display_name
    category: identifiant
    retention: >-
      Lot 49 (INV-01) : nom affiché d'un foyer (« Jeanne et Paul Durand »), avec ses réponses
      d'ensemble (hébergement, transport, si la planner pose ces questions). Purgé 30 jours après
      l'évènement.
    anonymization: >-
      Supprimé avec le foyer : purge RGP-08, effacement de la liste des invités de l'évènement
      (RGPD-03), annulation de l'import ; un foyer vidé de ses personnes est supprimé.
  - schema: guests
    table: household_groups
    field: label
    category: contenu_libre
    retention: >-
      Lot 49 (INV-01) : groupe d'invités créé à la volée (« Amis du lycée »), qui peut nommer des
      personnes. Purgé avec les foyers, 30 jours après l'évènement.
    anonymization: >-
      Supprimé à la purge de l'évènement (RGP-08) ou avec la liste des invités (RGPD-03).
  - schema: guests
    table: rsvp_answers
    field: attending
    category: contenu_libre
    retention: >-
      Lot 49 (INV-03) : présence d'une personne à un temps fort (oui ou non), donnée par son lien,
      par le répondant du foyer ou notée par la planner. Gardée après une opposition (sous le seul
      nom de la personne, DPO-3) ; purgée 30 jours après l'évènement.
    anonymization: >-
      Supprimée avec la personne (RGPD-03, RGP-08).
  - schema: guests
    table: diets
    field: options_sealed
    category: sensible
    retention: >-
      Lot 49 (INV-07, RGP-06, RGP-07, DAT-08) : régimes et allergies cochés dans la liste fermée de
      l'organisation (article 9), enregistrés seulement avec l'accord de l'invité lui-même (ou du
      représentant légal d'un enfant), chiffrés au niveau du champ (AES-256-GCM, clé
      DATA_ENCRYPTION_KEY, ADR 0079) ; nominatifs pour la titulaire seule, comptés ailleurs (« moins
      de 3 »). Ne sortent ni dans l'export complet de l'organisation, ni dans les copies hors ligne.
      Purgés 7 jours après le dernier jour de l'évènement.
    anonymization: >-
      Supprimés aussitôt au retrait de l'accord ou à l'opposition ; à la purge des régimes (J+7) ;
      avec la personne (RGPD-03).
  - schema: guests
    table: diet_consents
    field: guest_id
    category: identifiant
    retention: >-
      Lot 49 (RGP-06 ; réponse 3 de la DPO) : preuve de l'accord aux régimes, gardée pour la
      planner : personne concernée, personne qui a donné l'accord (given_by_guest_id), version du
      texte, canal, horodatages de l'accord et du retrait, déclaration de représentant légal.
      Rattachée à la personne jusqu'à la purge du reste (J+30).
    anonymization: >-
      À la purge (J+30) ou à l'effacement de la personne, la ligne perd la personne (guest_id et
      given_by_guest_id à null) : seul l'horodatage anonymisé reste, avec l'évènement.
  - schema: guests
    table: diet_consents
    field: given_by_guest_id
    category: identifiant
    retention: >-
      Lot 49 (RGP-06) : adulte qui a donné l'accord (lui-même, ou le représentant légal d'un
      enfant). Même règle que guest_id.
    anonymization: >-
      Mis à null avec guest_id (purge RGP-08, effacement RGPD-03).
  - schema: guests
    table: guest_links
    field: token_hash
    category: securite
    retention: >-
      Lot 49 (INV-03, SEC-14 à SEC-17) : empreinte SHA-256 du jeton du lien personnel d'un adulte
      invité (jamais d'un enfant : référence composée en base). Le lien expire à la fin du jour de
      clôture des réponses ; il est retiré à l'opposition. Purgé avec la personne (J+30).
    anonymization: >-
      Supprimé avec la personne (cascade) ; jamais exporté.
  - schema: guests
    table: purge_postponements
    field: reason
    category: contenu_libre
    retention: >-
      Lot 49 (RGP-08, D9) : motif du report unique de la purge, écrit par la planner (il peut nommer
      des personnes) ; le journal d'audit n'en garde que la date. Supprimé à la purge du reste.
    anonymization: >-
      Supprimé à la purge de l'évènement ou avec la liste des invités (RGPD-03).
  # Lot 50 (plan de table et synthèse pour le traiteur ; INV-05, INV-06 ; ADR 0086). Même base légale
  # que la liste des invités (lot 49) ; tout suit la purge des invités (30 jours après le dernier jour
  # de l'évènement) et l'effacement d'une personne. La synthèse pour le traiteur n'est jamais rangée
  # dans Symbola (D8) : calculée à la demande, nominative pour la titulaire seule (DPO-7) ; la copie
  # envoyée au traiteur sort de Symbola.
  - schema: guests
    table: seat_assignments
    field: guest_id
    category: identifiant
    retention: >-
      Lot 50 (INV-05) : place d'un invité à une table, par temps fort (une par invité et par plan) ;
      après un désistement, la ligne garde la date et le nom de la table jusqu'à ce que la planner
      efface l'alerte. Purgée avec les invités, 30 jours après l'évènement.
    anonymization: >-
      Supprimée avec la personne (cascade : effacement RGPD-03, purge RGP-08), avec sa table ou son
      plan, ou quand la planner retire l'invité de la table.
  - schema: guests
    table: seating_constraint_members
    field: guest_id
    category: identifiant
    retention: >-
      Lot 50 (INV-05, D4) : personne d'une contrainte de placement « ensemble » ou « séparés ». Donnée
      interne de l'organisation (un « séparés » dit souvent quelque chose de la famille) : jamais
      montrée au client, jamais dans une synthèse ni dans l'export complet de l'organisation. Purgée
      avec les invités, 30 jours après l'évènement (DPO-8 : durée plus courte à confirmer).
    anonymization: >-
      Supprimée avec la personne (cascade) ; une contrainte réduite à moins de deux personnes
      disparaît ; tout le plan part à la purge (RGP-08).
  - schema: guests
    table: guests
    field: meal_type_id
    category: identifiant
    retention: >-
      Lot 50 (INV-06, D5) : type de repas choisi pour un invité par la planner (vide : la valeur par
      défaut tirée de l'âge). Purgé avec la personne, 30 jours après l'évènement.
    anonymization: >-
      Supprimé avec la personne (RGPD-03, RGP-08).
  - schema: guests
    table: caterer_summary_downloads
    field: downloaded_by
    category: identifiant
    retention: >-
      Lot 50 (INV-06, D8) : membre de l'équipe qui a téléchargé la synthèse pour le traiteur, avec le
      temps fort, la version (nominative ou sans nom), le format et la date ; jamais le contenu. Le
      journal d'audit garde la même trace. Supprimée à la purge des invités de l'évènement (J+30).
    anonymization: >-
      Supprimée à la purge de l'évènement ou avec la liste des invités (RGPD-03).
  - schema: guests
    table: module_settings
    field: privacy_notice
    category: contenu_libre
    retention: >-
      Lot 49 (RGP-03, article 14) : mention d'information de la page de réponse des invités, écrite
      par la titulaire (elle peut nommer la planner). Tant que l'organisation existe.
    anonymization: >-
      Remplacée par le texte de départ quand la titulaire la vide.
  # Lot 52 (HUB-04, HUB-05, EVT-06, SEC-08 ; ADR 0094).
  - schema: events
    table: event_links
    field: phone
    category: contact
    retention: >-
      Lot 52 (EVT-06, D3) : téléphone facultatif du renfort du jour J, montré dans l'annuaire du jour à
      l'équipe et au renfort ; gardé avec le lien, purgé avec l'évènement.
    anonymization: >-
      Le lien du renfort est supprimé avec l'évènement (purge, oubli) ; son nom et son e-mail suivent les
      règles des liens personnels (person_name, email).
  - schema: hub
    table: sessions
    field: device_label
    category: securite
    retention: >-
      Lot 52 (HUB-05, D4) : navigateur et système de l'appareil (deux clés, sans version), montrés dans
      « Mes sessions » ; gardés tant que la session vit (huit heures sans activité). Ni adresse IP ni
      ville.
    anonymization: >-
      Supprimé avec la session (expiration, fermeture, révocation, suppression du compte).
  - schema: hub
    table: known_devices
    field: device_label
    category: securite
    retention: >-
      Lot 52 (SEC-08) : appareil déjà vu pour un compte (identifiant aléatoire du cookie, navigateur et
      système), pour reconnaître une connexion depuis un nouvel appareil ; oublié 30 jours après sa
      dernière activité (purge horaire).
    anonymization: >-
      Supprimé avec le compte (cascade) ou par la purge des 30 jours.
  - schema: hub
    table: identity_change_alerts
    field: previous_email
    category: contact
    retention: >-
      Lot 52 (SEC-08, D6) : ancienne adresse d'un compte dont l'adresse a changé chez le fournisseur
      d'identité, gardée seulement jusqu'à l'envoi de l'alerte qui part vers elle ; la ligne reste 30
      jours sans adresse.
    anonymization: >-
      Effacée à l'envoi de l'alerte ; la ligne est supprimée après 30 jours, ou avec le compte (cascade).
  # Lot 48a (PRE-05, PRE-10, SEC-27, DAT-08 ; ADR 0093) : IBAN, BIC et note confidentielle des
  # prestataires chiffrés, journal masqué des changements d'IBAN, pièces, notes d'évènement
  # confidentielles.
  - schema: vendors
    table: vendors
    field: iban_sealed
    category: identifiant
    retention: >-
      Lot 48a (PRE-10, DAT-08) : IBAN d'un prestataire (celui d'un entrepreneur individuel est une
      donnée personnelle), chiffré au niveau du champ ; seul l'IBAN masqué (iban_masked) se montre.
      Jamais montré au client tant qu'un changement attend la vérification de la planner ; absent
      de l'export complet. Tant que la fiche existe.
    anonymization: >-
      Mis à nul à l'oubli de la fiche (RGPD-03), avec l'IBAN masqué et le BIC.
  - schema: vendors
    table: vendors
    field: bic_sealed
    category: identifiant
    retention: >-
      Lot 48a (DAT-08) : BIC d'un prestataire, chiffré comme son IBAN.
    anonymization: >-
      Mis à nul à l'oubli de la fiche (RGPD-03).
  - schema: vendors
    table: vendors
    field: iban_masked
    category: identifiant
    retention: >-
      Lot 48a (PRE-10) : IBAN masqué (« FR76 •••• •••• 1234 »), seule forme montrée à l'écran.
    anonymization: >-
      Mis à nul à l'oubli de la fiche (RGPD-03).
  - schema: vendors
    table: vendors
    field: internal_note_sealed
    category: contenu_libre
    retention: >-
      Lot 48a (DAT-08) : note interne marquée confidentielle, chiffrée au niveau du champ ; lue par
      son auteur et la titulaire seuls ; absente des recherches et de l'export complet. Tant que la
      fiche existe.
    anonymization: >-
      Mise à nul à l'oubli de la fiche (RGPD-03).
  - schema: vendors
    table: vendor_bank_changes
    field: previous_masked
    category: identifiant
    retention: >-
      Lot 48a (PRE-10, SEC-27) : ancien et nouvel IBAN masqués d'un changement, qui l'a fait, quand,
      et sa vérification par téléphone (journal). Jamais d'IBAN en clair. Tant que la fiche existe.
    anonymization: >-
      Supprimé avec la fiche à l'oubli (RGPD-03).
  - schema: vendors
    table: vendor_bank_changes
    field: next_masked
    category: identifiant
    retention: >-
      Lot 48a (PRE-10, SEC-27) : voir previous_masked.
    anonymization: >-
      Supprimé avec la fiche à l'oubli (RGPD-03).
  - schema: vendors
    table: vendor_documents
    field: file_key
    category: identifiant
    retention: >-
      Lot 48a (PRE-05) : pièce d'un prestataire (attestation d'assurance, Kbis ou avis Insee, plan),
      fichier privé servi par l'app (ADR 0027), avec sa fin de validité. Tant que la fiche existe ;
      la planner la retire quand elle n'est plus utile.
    anonymization: >-
      Supprimée avec son fichier à l'oubli de la fiche (RGPD-03).
  - schema: events
    table: events
    field: notes_sealed
    category: contenu_libre
    retention: >-
      Lot 48a (DAT-08) : notes de l'évènement marquées confidentielles, chiffrées au niveau du champ
      (notes est vide) ; lues par leur auteur et la titulaire seuls, absentes des recherches et de
      l'export complet ; rendues en clair à la personne qui exerce son droit d'accès. Tant que
      l'évènement existe.
    anonymization: >-
      Effacées lors d'une demande d'oubli qui vise l'évènement (RGPD-03).
  # Lot 48b (BUD-08, PRE-07 ; ADR 0093) : commissions des prestataires (nom du prestataire copié).
  - schema: quotes
    table: vendor_commissions
    field: vendor_name
    category: identifiant
    retention: >-
      Lot 48b (PRE-07) : nom du prestataire qui verse la commission (un entrepreneur individuel peut
      porter son nom), copié pour la facture de commission qui le fige. Tant que l'évènement existe ;
      la facture émise suit la conservation des pièces comptables.
    anonymization: >-
      Supprimée avec l'évènement si elle n'est pas facturée ; facturée, elle suit la conservation de
      sa facture.
  # Lot 53 (HUB-15, UX-16, ARC-09 ; D3, D4 ; ADR 0095, ADR 0096 ; DPO-10) : notifications de l'équipe et
  # abonnements push. Les services de push des navigateurs (Apple, Google, Mozilla) ne reçoivent qu'un
  # message chiffré (la sorte en mots et un chemin de l'app), son heure et sa durée de vie : destinataires
  # techniques (docs/conformite/sous-traitants.md).
  - schema: hub
    table: notifications
    field: user_id
    category: identifiant
    retention: >-
      Lot 53 (HUB-15) : la personne de l'équipe destinataire (identifiant). Effacée avec la notification,
      90 jours après sa création (notifications.json), ou avec le compte.
    anonymization: >-
      Supprimée avec la notification ou le compte (clé étrangère, suppression en cascade).
  - schema: hub
    table: notifications
    field: params
    category: contenu_libre
    retention: >-
      Lot 53 (HUB-15, UX-16) : libellés courts de la notification (numéro de devis, intitulé de tâche ou de
      décision, montant) ; jamais d'adresse, de téléphone ni de message. Montrés dans l'application et le
      corps d'un e-mail à l'équipe seulement ; jamais dans un push ni dans l'objet d'un e-mail (SEC-20).
      Effacés 90 jours après la création de la notification.
    anonymization: >-
      Supprimés avec la notification (purge quotidienne) ou avec le compte destinataire.
  - schema: hub
    table: push_subscriptions
    field: endpoint
    category: identifiant
    retention: >-
      Lot 53 (ARC-09, D4 ; DPO-10) : adresse du service de push du navigateur d'un appareil (donnée
      technique). Supprimée à la désactivation du push sur l'appareil, quand le service répond qu'elle
      n'existe plus, ou après 90 jours sans usage ; jamais dans un écran ni un journal.
    anonymization: >-
      Supprimée (purge quotidienne, désactivation, compte supprimé).
  - schema: hub
    table: push_subscriptions
    field: p256dh
    category: securite
    retention: >-
      Lot 53 (ARC-09, D4) : clés publiques de l'abonnement push (p256dh, auth), qui servent à chiffrer le
      message jusqu'au navigateur. Mêmes durée et effacement que l'adresse de l'abonnement.
    anonymization: >-
      Supprimées avec l'abonnement.
  - schema: hub
    table: push_subscriptions
    field: device_label
    category: identifiant
    retention: >-
      Lot 53 (ARC-09) : nom lisible de l'appareil (navigateur et système, sans identifiant), pour que la
      personne reconnaisse ses appareils. Mêmes durée et effacement que l'abonnement.
    anonymization: >-
      Supprimé avec l'abonnement.
  - schema: events
    table: event_closings
    field: lessons
    category: contenu_libre
    retention: >-
      Lot 58 (PAR-09, ADR 0097) : trois leçons de la planner à la clôture d'un évènement, internes
      (jamais montrées au client ni au comptable). Tant que l'évènement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli visant un client de l'évènement : effacées ; exportées avec l'organisation
      (HUB-13).
  - schema: events
    table: event_closings
    field: own_expenses
    category: contenu_libre
    retention: >-
      Lot 58 (PAR-09, D4) : frais propres de la planner (libellé libre et montant), hors du budget du
      client, internes. Tant que l'évènement existe.
    anonymization: >-
      Lors d'une demande d'oubli visant un client de l'évènement : libellés remplacés par « [anonymisé] »,
      montants gardés (le bilan reste juste).
  - schema: vendors
    table: vendor_evaluations
    field: comment
    category: contenu_libre
    retention: >-
      Lot 58 (PRE-08, ADR 0097) : commentaire de l'équipe sur un prestataire après un évènement, toujours
      interne (jamais montré au client, au prestataire ni au comptable, jamais exporté vers un tiers).
      Tant que la fiche existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli visant le prestataire (RGPD-03) : effacé ; la note et les critères
      restent, rattachés à la fiche anonymisée.
  # Lot 55 (MSG-03, POR-06, MSG-04, MSG-05, POR-11 ; ADR 0101) : messagerie par sujet, journal des
  # envois, abonnements push des clients. L'adresse d'expédition d'une organisation
  # (hub.organizations.sender_local_part) est celle d'une entreprise, pas d'une personne.
  - schema: events
    table: message_topics
    field: name
    category: contenu_libre
    retention: >-
      Lot 55 (MSG-03) : nom court d'un sujet de discussion (« Traiteur »), écrit par l'équipe ou par un
      client ; lu par les liens du sujet s'il a un message partagé. Tant que l'évènement existe ; voir
      RGPD-03/RGPD-05.
    anonymization: >-
      Supprimé avec l'évènement ; remplacé par « [anonymisé] » lors d'une demande d'oubli qui le vise.
  - schema: events
    table: messages
    field: body
    category: contenu_libre
    retention: >-
      Lot 55 (MSG-03, POR-06) : texte d'un message, interne (l'équipe seulement) ou partagé (clients du
      lien qui ouvre la rubrique « Messages », prestataires du sujet) ; jamais dans un e-mail ni un
      push (ils n'annoncent que le sujet). Trouvé par la recherche RGPD. Tant que l'évènement existe ;
      voir RGPD-03/RGPD-05.
    anonymization: >-
      Supprimé (avec ses pièces jointes) lors d'une demande d'oubli qui le vise ou qui vise
      l'évènement.
  - schema: events
    table: messages
    field: author_name
    category: identifiant
    retention: >-
      Lot 55 (MSG-03) : nom affiché de l'auteur d'un message (le nom de l'organisation pour l'équipe, le
      nom du lien pour un client ou un prestataire), copié pour que le fil reste lisible si le lien est
      retiré. Tant que le message existe.
    anonymization: >-
      Supprimé avec le message.
  - schema: events
    table: messages
    field: author_user_id
    category: identifiant
    retention: >-
      Lot 55 (MSG-03) : compte de l'équipe auteur du message (identifiant, sans nom ni e-mail dans la
      table). Tant que le message existe.
    anonymization: >-
      Supprimé avec le message.
  - schema: events
    table: message_attachments
    field: label
    category: contenu_libre
    retention: >-
      Lot 55 (POR-06 ; ADR 0027) : intitulé d'une pièce jointe (nom du fichier envoyé), trouvé par la
      recherche RGPD. Tant que le message existe.
    anonymization: >-
      Supprimé avec le message.
  - schema: events
    table: message_attachments
    field: file_key
    category: contenu_libre
    retention: >-
      Lot 55 (POR-06 ; ADR 0027) : fichier joint à un message (stockage privé, contrôlé à l'envoi :
      type par le contenu, taille, antivirus), servi par l'app après contrôle des droits. Tant que le
      message existe.
    anonymization: >-
      Le fichier est supprimé du stockage avec le message.
  - schema: events
    table: link_push_subscriptions
    field: endpoint
    category: identifiant
    retention: >-
      Lot 55 (POR-11 ; DPO) : adresse du service de push du navigateur d'un appareil d'un client, qui a
      activé les notifications du portail (facultatif, désactivé par défaut). Supprimée à la
      désactivation, quand le service répond qu'elle n'existe plus, ou avec le lien ; jamais dans un
      écran ni un journal.
    anonymization: >-
      Supprimée (désactivation, lien retiré ou effacé).
  - schema: events
    table: link_push_subscriptions
    field: p256dh
    category: securite
    retention: >-
      Lot 55 (POR-11) : clés publiques de l'abonnement push (p256dh, auth), qui chiffrent le message
      jusqu'au navigateur. Mêmes durée et effacement que l'adresse de l'abonnement.
    anonymization: >-
      Supprimées avec l'abonnement.
  - schema: hub
    table: email_deliveries
    field: recipient
    category: contact
    retention: >-
      Lot 55 (MSG-05 ; DPO) : adresse e-mail du destinataire d'un e-mail envoyé au nom de
      l'organisation, avec l'objet et le statut (envoyé, remis, rejeté, plainte), jamais le contenu.
      Gardée 13 mois après l'envoi, puis effacée (purge quotidienne) ; trouvée par la recherche RGPD.
    anonymization: >-
      Supprimée (la ligne entière) lors d'une demande d'oubli qui la vise, et à 13 mois.
  - schema: hub
    table: email_deliveries
    field: recipient_hash
    category: identifiant
    retention: >-
      Lot 55 (MSG-05) : empreinte SHA-256 de l'adresse du destinataire, pour retrouver les envois d'un
      contact (alerte de rejet sur sa fiche). Mêmes durée et effacement que la ligne.
    anonymization: >-
      Supprimée avec la ligne.
  - schema: hub
    table: email_deliveries
    field: subject
    category: contenu_libre
    retention: >-
      Lot 55 (MSG-05) : objet de l'e-mail envoyé (écrit par Symbola depuis le modèle de l'organisation ;
      il peut nommer l'évènement ou un sujet). Mêmes durée et effacement que la ligne.
    anonymization: >-
      Supprimé avec la ligne.
