# Registre des champs personnels (SOC-07, CLAUDE.md §2.8). Chaque champ
# personnel nouveau doit être déclaré ici avant/au moment de sa migration —
# sinon la CI échoue (packages/privacy/scripts/check-registry.ts).
version: 1
fields:
  - schema: hub
    table: users
    field: email
    category: identifiant
    retention: >-
      Tant que le compte existe. Après suppression ou demande d'oubli :
      voir RGPD-03/RGPD-05 (purge selon les règles de conservation du
      cahier des charges).
    anonymization: >-
      Comptes de l'équipe de la planner et de l'Admin seulement : depuis le lot
      26a (ADR 0053), les tiers n'ont plus de compte ; leur lien personnel est
      déclaré sous events.event_links.
  - schema: hub
    table: users
    field: last_login_at
    category: securite
    retention: >-
      Lot 6 (RGPD-05) : date de la dernière connexion réussie, mise à jour à
      chaque connexion. Gardée tant que le compte existe (lot 26a : les comptes
      de mariés, dont elle réglait la suppression, n'existent plus).
    anonymization: >-
      Supprimée avec le compte (oubli ou purge).
  - schema: hub
    table: privacy_purges
    field: lines
    category: contenu_libre
    retention: >-
      Lot 6 (RGPD-05) : trace d'une purge validée ; seul le motif d'exclusion
      d'une ligne est un texte libre saisi par la titulaire (qui peut citer une
      personne). Références opaques et dates sinon, jamais de nom. Gardée
      comme preuve pendant la prescription applicable.
    anonymization: >-
      Motifs d'exclusion effacés à la fin de la conservation de la preuve.
  - schema: hub
    table: organization_profiles
    field: address
    category: contact
    retention: >-
      Tant que l'organisation existe. Après suppression ou demande
      d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par une valeur générée non réversible lors d'une demande
      d'oubli (RGPD-03).
  - schema: hub
    table: organization_profiles
    field: contact_email
    category: contact
    retention: >-
      Lot 17 (DEV-07) : e-mail de contact imprimé sur les devis et les
      factures, celui d'une entrepreneuse individuelle pouvant être
      personnel. Tant que l'organisation existe ; modifiable et effaçable
      par elle dans Entreprise et TVA. Les documents émis en gardent la
      copie figée (seller_snapshot).
    anonymization: >-
      Effacé avec la fiche de l'organisation ; les copies figées suivent la
      conservation de leur document.
  - schema: hub
    table: organization_profiles
    field: contact_phone
    category: contact
    retention: >-
      Lot 17 (DEV-07) : téléphone de contact imprimé sur les devis et les
      factures. Même conservation que contact_email.
    anonymization: >-
      Effacé avec la fiche de l'organisation ; les copies figées suivent la
      conservation de leur document.
  - schema: quotes
    table: quote_settings
    field: iban
    category: identifiant
    retention: >-
      Lot 17 (DEV-11) : IBAN imprimé sur les devis et les factures pour le
      virement des clients ; celui d'une entrepreneuse individuelle est une
      donnée personnelle. Tant que l'organisation le garde dans ses
      réglages ; jamais écrit dans les journaux. Les documents émis en
      gardent la copie figée (seller_snapshot).
    anonymization: >-
      Effacé avec les réglages de l'organisation ; les copies figées
      suivent la conservation de leur document.
  - schema: hub
    table: invitations
    field: email
    category: identifiant
    retention: >-
      7 jours (durée de validité de l'invitation, PRD PRD-HUB-03), puis
      purgée ou anonymisée après expiration ou acceptation — à outiller
      avec la purge RGPD-05.
    anonymization: >-
      Remplacé par une valeur générée non réversible lors d'une demande
      d'oubli (RGPD-03) antérieure à l'expiration.
  - schema: hub
    table: imports
    field: rows
    category: identifiant
    retention: >-
      Lot 5 (IMP-01) : lignes lues du fichier d'import (noms, e-mails, dates
      des clients…), gardées seulement le temps de finir l'import en cours —
      effacées à la confirmation, à l'abandon ou à l'expiration (7 jours
      proposés, réglage de la plateforme, purge horaire). Le fichier lui-même
      n'est jamais stocké.
    anonymization: >-
      Effacées (null) lors d'une demande d'oubli (RGPD-03) visant une personne
      présente dans un import en cours.
  - schema: hub
    table: imports
    field: headers
    category: identifiant
    retention: >-
      Lot 5 (IMP-01) : intitulés des colonnes du fichier (une colonne sans
      en-tête peut porter une valeur à la place) ; conservés au journal des
      imports tant que l'organisation existe. Voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacés par des intitulés génériques lors d'une demande d'oubli
      (RGPD-03).
  - schema: hub
    table: import_jobs
    field: payload
    category: identifiant
    retention: >-
      Lot 15 (IMP-10) : noms des fiches PDF en cours de lecture, avec l'adresse
      et la clé de chaque fiche gardée chiffrée. Effacés dès la fin de la
      lecture, l'abandon ou l'expiration de l'import (les fiches sont alors
      supprimées du stockage).
    anonymization: >-
      Rien à anonymiser au-delà de la lecture : la liste des fiches est vidée.
  - schema: hub
    table: imports
    field: file_name
    category: identifiant
    retention: >-
      Lot 5 (IMP-01) : nom du fichier importé (peut contenir un nom de
      client), au journal des imports tant que l'organisation existe. Voir
      RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli (RGPD-03).
  - schema: hub
    table: import_items
    field: previous
    category: identifiant
    retention: >-
      Lot 5 (IMP-05) : valeurs d'un élément avant qu'un import confirmé le
      mette à jour (noms des clients, montants…), gardées pour pouvoir annuler
      l'import pendant le délai réglé par l'Admin (90 jours), puis effacées par
      la purge horaire ; la ligne du journal reste.
    anonymization: >-
      Effacées (null) lors d'une demande d'oubli (RGPD-03) ; l'import concerné
      n'est alors plus annulable pour cet élément.
  - schema: hub
    table: import_items
    field: written
    category: identifiant
    retention: >-
      Lot 5 (IMP-05) : valeurs écrites par un import confirmé, gardées pour
      détecter une modification à la main avant une annulation, pendant le
      délai d'annulation (90 jours), puis effacées par la purge horaire.
    anonymization: >-
      Effacées (null) lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: events
    field: imported_fields
    category: contenu_libre
    retention: >-
      Lot 5 (IMP-04/IMP-05) : colonnes d'un fichier importé gardées en champ
      libre sur la fiche (peuvent contenir un e-mail, un téléphone…). Tant que
      l'événement existe. Voir RGPD-03/RGPD-05.
    anonymization: >-
      Effacés (null) lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: event_tasks
    field: imported_fields
    category: contenu_libre
    retention: >-
      Lot 5 (IMP-04/IMP-05) : champs libres d'une tâche importée, tant que la
      tâche existe. Voir RGPD-03/RGPD-05.
    anonymization: >-
      Effacés (null) lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: event_vendor_slots
    field: imported_fields
    category: contenu_libre
    retention: >-
      Lot 5 (IMP-04/IMP-05) : champs libres d'un poste importé avec une ligne
      de budget, tant que le poste existe. Voir RGPD-03/RGPD-05.
    anonymization: >-
      Effacés (null) lors d'une demande d'oubli (RGPD-03).
  - schema: quotes
    table: catalog_items
    field: imported_fields
    category: contenu_libre
    retention: >-
      Lot 5 (IMP-04/IMP-05) : champs libres d'un article importé, tant que
      l'article existe.
    anonymization: >-
      Effacés (null) lors d'une demande d'oubli (RGPD-03) qui les viserait.
  - schema: hub
    table: privacy_requests
    field: person_label
    category: identifiant
    retention: >-
      Lot 6 (RGPD-04) : personne concernée par une demande d'exercice de droits
      (libellé saisi par la titulaire). Gardé avec la demande, comme preuve de
      son traitement, pendant la prescription applicable (cahier des charges
      § 6, référentiel CNIL) : durée réglée par l'organisation après le jour
      de clôture (hub.privacy_settings.request_proof_retention_months, 5 ans
      par défaut, prescription civile, décision de Julien du 09/11/2026, à
      valider par un juriste ; lot 19, RGPD-09, ADR 0048). Une demande en
      cours est gardée telle quelle.
    anonymization: >-
      Remplacé par « [anonymisé] » à la fin de la conservation de la preuve,
      par la purge mensuelle validée par la titulaire (RGPD-05, RGPD-09) ; le
      type, les dates et le journal de la demande restent. Affiché traduit à
      l'écran.
  - schema: hub
    table: privacy_requests
    field: extension_reason
    category: contenu_libre
    retention: >-
      Lot 6 (RGPD-04) : motif de prolongation d'une demande complexe, gardé
      avec la demande pendant la même durée (preuve, RGPD-09).
    anonymization: >-
      Effacé (null) à la fin de la conservation de la preuve, par la même
      ligne de la purge mensuelle que le nom de la personne (RGPD-09).
  - schema: events
    table: event_clients
    field: first_name
    category: identifiant
    retention: >-
      Tant que l'événement existe. Après suppression ou demande d'oubli :
      voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: event_clients
    field: last_name
    category: identifiant
    retention: >-
      Tant que l'événement existe. Après suppression ou demande d'oubli :
      voir RGPD-03/RGPD-05.
    anonymization: >-
      Mis à nul lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: event_clients
    field: email
    category: contact
    retention: >-
      Lot 14 (décision I) : e-mail du client. Tant que l'événement existe. Après
      suppression ou demande d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Mis à nul lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: event_clients
    field: phone
    category: contact
    retention: >-
      Lot 14 (décision I) : téléphone du client. Tant que l'événement existe. Après
      suppression ou demande d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Mis à nul lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: event_clients
    field: address_line
    category: contact
    retention: >-
      Lot 14 (décision I) : adresse du client. Tant que l'événement existe. Après
      suppression ou demande d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Mis à nul lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: event_clients
    field: postal_code
    category: contact
    retention: >-
      Lot 14 (décision I) : code postal du client. Tant que l'événement existe. Après
      suppression ou demande d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Mis à nul lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: event_clients
    field: city
    category: contact
    retention: >-
      Lot 14 (décision I) : ville du client. Tant que l'événement existe. Après
      suppression ou demande d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Mis à nul lors d'une demande d'oubli (RGPD-03).
  - schema: events
    table: program_item_participants
    field: free_label
    category: identifiant
    retention: >-
      Tant que l'événement existe (intervenant libre du programme du jour J,
      PRD-EVT-05 : officiant, témoin…). Après suppression ou demande d'oubli :
      voir RGPD-03/RGPD-05.
    anonymization: >-
      L'intervenant est supprimé lors d'une demande d'oubli qui le vise (RGPD-03),
      comme lors d'un effacement.
  - schema: events
    table: event_places
    field: address
    category: contact
    retention: >-
      Lot 12 (L12-EVT-15) : adresse d'un lieu de l'événement (celle des préparatifs
      peut être le domicile des mariés). Tant que l'événement existe ; voir
      RGPD-03/RGPD-05.
    anonymization: >-
      Le lieu est supprimé lors d'une demande d'oubli qui le vise ou qui vise
      l'événement (RGPD-03), comme le lieu de réception de l'événement.
  - schema: events
    table: program_items
    field: internal_note
    category: contenu_libre
    retention: >-
      Tant que l'événement existe (note interne d'une ligne du programme,
      PRD-EVT-05, jamais montrée aux mariés). Après suppression ou demande
      d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      La ligne du programme est supprimée lors d'une demande d'oubli qui la vise
      (RGPD-03) ; texte libre, sans intérêt statistique.
  - schema: events
    table: event_client_accesses
    field: email
    category: contact
    retention: >-
      Table retirée au lot 26a (migration 0112, ADR 0053) : les invitations des
      comptes de mariés (ADR 0020) sont remplacées par les liens personnels
      (events.event_links). Entrée gardée parce que la migration 0026 qui l'a
      créée reste dans l'historique.
    anonymization: >-
      Sans objet depuis le lot 26a (table supprimée, données fictives seulement).
  - schema: events
    table: event_links
    field: person_name
    category: identifiant
    retention: >-
      Lot 26a (UX-11, POR-01, ADR 0053) : nom de la personne d'un lien personnel
      (client, parent payeur), affiché à la planner et dans le portail ; tant
      que le lien existe, purgé avec l'événement. Après suppression ou demande
      d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Le lien (et ses sessions) est supprimé lors d'une demande d'oubli qui le
      vise (RGPD-03) ; ses coches du fil d'activité perdent leur auteur.
  - schema: events
    table: event_links
    field: email
    category: contact
    retention: >-
      Lot 26a : adresse où le lien personnel est envoyé, et qui reconnaît les
      devis à signer de la personne ; tant que le lien existe, purgée avec
      l'événement. Après suppression ou demande d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Le lien est supprimé lors d'une demande d'oubli qui le vise (RGPD-03).
  - schema: budget
    table: budget_lines
    field: label
    category: contenu_libre
    retention: >-
      Lot 28b (BUD-01, Q33) : libellé libre d'une ligne de budget (« Robe de
      Léa »), tant que la ligne existe. Après suppression ou demande d'oubli :
      voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli (RGPD-03) ; les
      montants restent pour les totaux.
  - schema: budget
    table: vendor_payments
    field: label
    category: contenu_libre
    retention: >-
      Lot 28b (BUD-03) : libellé libre d'une échéance due à un prestataire
      (« Acompte du traiteur »), tant que la ligne existe. Après suppression ou
      demande d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli (RGPD-03) ; le
      montant et les dates restent.
  - schema: budget
    table: budget_line_attachments
    field: file_key
    category: contenu_libre
    retention: >-
      Tant que la ligne de budget existe (PRD-BUD-03 : devis d'un prestataire,
      stocké en privé ; le document peut nommer un prestataire indépendant,
      donc une personne). Le contenu du fichier n'est pas indexé : il n'entre
      pas dans la recherche RGPD par terme. Après suppression ou demande
      d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Le document est supprimé du stockage (pas d'anonymisation partielle
      d'un PDF ou d'une image) ; la ligne de budget reste.
  - schema: quotes
    table: quote_lines
    field: description
    category: contenu_libre
    retention: >-
      Tant que le devis existe (DEV-01 : précision libre d'une ligne, qui
      peut nommer un marié ou un prestataire). Un devis envoyé est figé ;
      après suppression ou demande d'oubli : voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli (RGPD-03), sauf sur un
      devis signé (preuve du contrat) ; les montants, l'intitulé et la numérotation
      restent.
  - schema: quotes
    table: quote_versions
    field: seller_snapshot
    category: contact
    retention: >-
      Copie figée à l'envoi de l'en-tête vendeur (DEV-01, ONB-02 : nom,
      adresse et SIREN de l'organisation, l'adresse pouvant être celle
      d'une entrepreneuse individuelle ; depuis le lot 17, DEV-07 et
      DEV-11 : aussi e-mail et téléphone de contact, IBAN et apparence du
      document). Conservée avec la version envoyée du devis ; voir
      RGPD-03/RGPD-05.
    anonymization: >-
      L'adresse est remplacée par « [anonymisé] » lors d'une demande
      d'oubli de l'organisation (RGPD-03), sauf obligation légale de
      conservation (factures, lot 4).
  - schema: quotes
    table: quote_signers
    field: name
    category: identifiant
    retention: >-
      Tant que le devis existe (DEV-02 : signataire saisi sur le devis, copie
      figée avec la version envoyée en signature). Voir RGPD-03/RGPD-05 ; un
      devis signé lié à une facture suit la conservation légale de celle-ci.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli (RGPD-03), sauf sur un
      devis signé, conservé comme preuve du contrat (5 ans par défaut, réglage de
      l'organisation) puis anonymisé par la purge (RGPD-05).
  - schema: quotes
    table: quote_signers
    field: email
    category: contact
    retention: >-
      Tant que le devis existe (DEV-02 : adresse à laquelle Symbola envoie le
      lien de signature). Voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par une valeur générée non réversible lors d'une demande d'oubli
      (RGPD-03), sauf sur un devis signé (preuve du contrat, même durée).
  - schema: quotes
    table: quote_signers
    field: billing_address
    category: contact
    retention: >-
      Tant que le devis existe (DEV-02 : adresse de facturation reprise sur
      les factures, DEV-04). Voir RGPD-03/RGPD-05 ; conservation légale des
      factures émises.
    anonymization: >-
      Remplacée par « [anonymisé] » lors d'une demande d'oubli (RGPD-03), sauf sur
      un devis signé (preuve du contrat) ; jamais modifiée sur une facture émise
      (conservation légale).
  - schema: quotes
    table: quote_signers
    field: signing_url
    category: securite
    retention: >-
      Tant que le devis existe (DEV-02 : lien personnel de signature chez le
      fournisseur, affiché à la planner et au marié concerné uniquement).
    anonymization: >-
      Supprimé (remplacé par une valeur vide) lors d'une demande d'oubli ;
      le lien ne sert plus une fois la demande terminée.
  - schema: quotes
    table: invoices
    field: buyer_snapshot
    category: contact
    retention: >-
      Conservation légale des factures (DEV-04 : nom et adresse de
      facturation des acheteurs, copiés et figés à l'émission ; 10 ans,
      code de commerce — à confirmer avec le comptable). Une demande d'oubli
      n'efface pas une facture émise : elle est signalée « conservation
      légale » dans le suivi RGPD (RGPD-03).
    anonymization: >-
      Aucune avant la fin de la conservation légale (facture immuable) ;
      suppression à son terme (RGPD-05).
  - schema: quotes
    table: invoices
    field: seller_snapshot
    category: contact
    retention: >-
      Conservation légale des factures (DEV-04 : en-tête vendeur figé à
      l'émission, l'adresse pouvant être celle d'une entrepreneuse
      individuelle ; depuis le lot 17 : aussi e-mail et téléphone de
      contact, IBAN et apparence du document). Voir invoices.buyer_snapshot.
    anonymization: >-
      Aucune avant la fin de la conservation légale (facture immuable).
  - schema: quotes
    table: credit_notes
    field: buyer_snapshot
    category: contact
    retention: >-
      Conservation légale, comme la facture corrigée (DEV-04).
    anonymization: >-
      Aucune avant la fin de la conservation légale (avoir immuable).
  - schema: quotes
    table: credit_notes
    field: seller_snapshot
    category: contact
    retention: >-
      Conservation légale, comme la facture corrigée (DEV-04).
    anonymization: >-
      Aucune avant la fin de la conservation légale (avoir immuable).
  - schema: vendors
    table: vendors
    field: name
    category: identifiant
    retention: >-
      Lot 11 (ADR 0031) : le nom d'un prestataire indépendant est une personne. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: contact_name
    category: identifiant
    retention: >-
      Lot 11 (ADR 0031) : nom du contact chez le prestataire. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: email
    category: contact
    retention: >-
      Lot 11 (ADR 0031) : e-mail du prestataire ou de son contact. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: phone
    category: contact
    retention: >-
      Lot 11 (ADR 0031) : téléphone du prestataire ou de son contact. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: address_line
    category: contact
    retention: >-
      Lot 11 (ADR 0031) : adresse (celle d'un indépendant peut être son domicile). Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: postal_code
    category: contact
    retention: >-
      Lot 11 (ADR 0031) : code postal de l'adresse. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: internal_note
    category: contenu_libre
    retention: >-
      Lot 11 (ADR 0031) : note interne de l'équipe. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: rating
    category: contenu_libre
    retention: >-
      Lot 28c (PRE-01, D8) : évaluation interne de l'équipe (1 à 5), jamais montrée hors de l'organisation. Tant que la fiche existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : effacée avec la note interne ; exportée avec la fiche (RGPD-02).
  - schema: vendors
    table: vendors
    field: indicative_prices
    category: contenu_libre
    retention: >-
      Lot 28c (PRE-01, D8) : tarifs indicatifs en texte libre, saisis par l'équipe. Tant que la fiche existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : effacés avec la note interne ; exportés avec la fiche (RGPD-02).
  - schema: vendors
    table: vendors
    field: field_values
    category: contenu_libre
    retention: >-
      Lot 11 (ADR 0031) : champs propres au type, saisis par l'équipe. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: website
    category: contact
    retention: >-
      Lot 14 (décision M) : site web du prestataire (celui d'un indépendant peut porter son nom). Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note, site, réseaux, SIRET, champs importés et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: social_links
    category: contact
    retention: >-
      Lot 14 (décision M) : liens vers les réseaux sociaux du prestataire. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note, site, réseaux, SIRET, champs importés et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: siret
    category: identifiant
    retention: >-
      Lot 14 (décision M) : SIRET (celui d'un entrepreneur individuel désigne une personne). Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note, site, réseaux, SIRET, champs importés et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendors
    field: imported_fields
    category: contenu_libre
    retention: >-
      Lot 14 (IMP-07) : colonnes d'un import gardées telles quelles (TVA intracommunautaire, code APE, statut juridique…). Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Lors d'une demande d'oubli (RGPD-03) : nom remplacé par « [anonymisé] », contact, e-mail, téléphone, adresse, note, site, réseaux, SIRET, champs importés et point effacés, fiche archivée (l'historique garde son identifiant).
  - schema: vendors
    table: vendor_files
    field: file_key
    category: contenu_libre
    retention: >-
      Lot 11 (ADR 0031) : plaquette ou RIB (fichier privé). Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Supprimé, fichier compris, lors d'une demande d'oubli de la fiche (RGPD-03).
  - schema: events
    table: event_vendor_candidates
    field: vendor_name
    category: identifiant
    retention: >-
      Lot 11 (ADR 0031) : nom d'un prestataire consulté pour un poste. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Remplacé par « [anonymisé] » lors d'une demande d'oubli (RGPD-03) ; le devis joint, qui nomme le prestataire, est supprimé.
  - schema: events
    table: event_vendor_candidate_notes
    field: body
    category: contenu_libre
    retention: >-
      Lot 11 (ADR 0031) : note sur un prestataire consulté, parfois montrée aux clients. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Supprimée lors d'une demande d'oubli du consulté ou de l'événement (RGPD-03).
  - schema: events
    table: event_vendor_slots
    field: brief
    category: contenu_libre
    retention: >-
      Lot 11 (ADR 0031) : ce que veulent les clients pour un poste. Tant que la fiche ou l'événement existe ; voir RGPD-03/RGPD-05.
    anonymization: >-
      Effacé (null) lors d'une demande d'oubli de l'événement (RGPD-03).
  - schema: core
    table: rate_limit_events
    field: key_hash
    category: securite
    retention: >-
      Lot 16 (L16-SEC-02, ADR 0044) : empreinte SHA-256 de l'adresse IP, de l'e-mail
      saisi ou de l'identifiant du compte, pour une tentative de connexion, de
      double authentification, de mot de passe oublié, de recherche ou d'envoi
      de fichier. Jamais la valeur en clair. Gardée un jour au plus (purge
      horaire), au titre de la sécurité du service.
    anonymization: >-
      Supprimée par la purge horaire ; rien à anonymiser au-delà.
  - schema: core
    table: audit_entries
    field: actor_id
    category: securite
    retention: >-
      Lot 23 (SEC-19, ARC-16, ADR 0060) : identifiant du compte auteur d'un geste
      sensible (connexion, droits, export, partage, émission, encaissement,
      suppression). Jamais de nom ni d'e-mail dans le journal. Journal en ajout
      seul : gardé, durée à fixer avec le DPO (fiche, question 11) puis purgé au
      lot 34 ; d'ici là, rien n'est purgé sauf les lignes d'un essai guidé.
    anonymization: >-
      Une fois le compte supprimé ou anonymisé, l'identifiant ne désigne plus
      personne. L'export RGPD des lignes qui concernent une personne reste à
      faire (bilan du lot 23).
  - schema: hub
    table: connection_traces
    field: ip
    category: securite
    retention: >-
      Lot 23 (SEC-19, décision D5, ADR 0060) : adresse IP d'une connexion, d'un
      échec ou d'un verrouillage, à part du journal d'audit. Illisible par l'app
      (droit d'écriture seul) ; lue seulement par un accès d'exploitation tracé
      (SEC-09). Purgée chaque jour passé
      platform_settings.connection_trace_retention_months (12 mois par défaut, à
      confirmer par le DPO, fiche question 11).
    anonymization: >-
      Supprimée par la purge quotidienne ; rien à anonymiser au-delà.
  - schema: quotes
    table: payment_entries
    field: reason
    category: contenu_libre
    retention: >-
      Lot 23b (JUR-05, décision D2, ADR 0061) : motif saisi par la planner quand elle
      annule un encaissement (écriture inverse, en ajout seul). Texte libre, qui peut
      citer une personne ; la chaîne des pièces n'en garde que l'empreinte. Conservé
      avec les pièces comptables (dix ans, JUR-06).
    anonymization: >-
      Écriture en ajout seul, conservée comme pièce comptable : pas d'effacement avant
      la fin de la conservation comptable ; l'aide invite à ne citer personne.
