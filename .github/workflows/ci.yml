name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:boundaries

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config=auto --error --severity=ERROR

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: gitleaks detect --source . -v --redact --exit-code 1

  osv-scanner:
    name: OSV-Scanner (dépendances)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v1.9.1
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml

  build-and-scan-image:
    name: Build image + Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build l'image symbola (non poussée)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/symbola/Dockerfile
          tags: symbola-app:ci
          push: false
          load: true
      - name: Scan Trivy (bloque sur CRITICAL)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: symbola-app:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
