name: CI

on:
  # Lot 76 (ADR 0124) : « labeled », pour qu'une PR étiquetée « suite-complete » rejoue la CI avec la
  # suite complète des parcours.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # Lot 76 : la suite complète à la demande (sur n'importe quelle branche), et chaque nuit sur main
  # (dates du jour, parcours instables), même sans fusion.
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

# Une PR ne garde que sa dernière exécution. Sur main, une exécution en cours n'est jamais coupée par
# la fusion suivante (lot 76) : sinon, avec des fusions rapprochées, la suite complète ne finirait
# jamais ; GitHub ne garde en attente que la plus récente.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Couverture des règles métier (NFR-21, lot 40b) — seuil de 80 % des lignes et des branches
        run: pnpm --filter @symbola/app test:coverage
      - run: pnpm check:boundaries
      - name: Registre RGPD (SOC-07) — colonnes personnelles non déclarées
        run: pnpm --filter @symbola/privacy check:registry
      - name: Traductions (PRD-HUB-04) — clés manquantes en FR ou EN
        run: pnpm --filter @symbola/i18n check:messages
      - name: Scripts serveur (SOC-10, SOC-12, lot 22) — shellcheck
        run: shellcheck -x infra/server/*.sh infra/backup/*.sh infra/map/*.sh infra/monitoring/*.sh

  db-isolation:
    name: Isolation RLS, authentification, événements et fichiers (services réels, SOC-04/05/06/08)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: symbola
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d symbola"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: symbola
      POSTGRES_ADMIN_USER: postgres
      POSTGRES_ADMIN_PASSWORD: ci-admin-password
      POSTGRES_APP_USER: symbola_app
      POSTGRES_APP_PASSWORD: ci-app-password
      S3_ACCESS_KEY: ci-s3-access-key-000000
      S3_SECRET_KEY: ci-s3-secret-key-0000000000000000000000
      S3_BUCKET: symbola
      CLAMAV_HOST: localhost
      CLAMAV_PORT: 3310
      SMTP_HOST: localhost
      SMTP_PORT: 1025
    steps:
      - uses: actions/checkout@v4
      # Lot 16 (L16-SEC-01, ADR 0037) : clé de chiffrement de la double
      # authentification, générée pour ce job (aucune valeur commitée).
      - name: Clé de l'app (liens magiques scellés, lot 33) et secret machine du fournisseur d'identité (fictif)
        run: |
          echo "MFA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          node apps/symbola/scripts/generate-vapid-keys.mjs >> "$GITHUB_ENV"
          echo "LOGTO_M2M_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Garage (ADR 0015) et ClamAV n'ont pas d'options "command" dans les
      # services GitHub Actions : démarrés manuellement en réseau hôte.
      - name: Démarrer Garage (stockage objet, SOC-08)
        run: |
          docker run -d --name garage --network host \
            -v "$GITHUB_WORKSPACE/infra/compose/garage.toml:/etc/garage.toml:ro" \
            -e GARAGE_DEFAULT_ACCESS_KEY="$S3_ACCESS_KEY" \
            -e GARAGE_DEFAULT_SECRET_KEY="$S3_SECRET_KEY" \
            -e GARAGE_DEFAULT_BUCKET="$S3_BUCKET" \
            -e GARAGE_RPC_SECRET="$(openssl rand -hex 32)" \
            -e GARAGE_ADMIN_TOKEN="$(openssl rand -base64 32)" \
            -e GARAGE_METRICS_TOKEN="$(openssl rand -base64 32)" \
            dxflrs/garage:v2.5.0 /garage server --single-node --default-bucket
      - name: Démarrer ClamAV (SOC-08)
        run: docker run -d --name clamav --network host clamav/clamav:1.4
      - name: Attendre que Garage et ClamAV soient prêts
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:3903/health; do sleep 2; done'
          timeout 180 bash -c 'until docker exec clamav clamdcheck.sh; do sleep 5; done'
      - run: pnpm --filter @symbola/db bootstrap
      - run: pnpm --filter @symbola/db migrate
      - run: pnpm --filter @symbola/db test:integration
      - run: pnpm --filter @symbola/mail test:integration
      - run: pnpm --filter @symbola/auth test:integration
      - run: pnpm --filter @symbola/files test:integration
      - run: pnpm --filter @symbola/app test:integration

  # Lot 76 (ARC-20, SEC-36 ; ADR 0124) : une CI en deux vitesses. Ce job choisit les parcours de bout
  # en bout à jouer (tools/ci-pipeline/plan-parcours.mjs) :
  # - sur une pull request, la voie rapide : le socle (apps/symbola/e2e/socle.ts) et les fichiers de
  #   parcours que la PR modifie ou ajoute, sous Chromium, en ordinateur et en 375 px, et les mesures
  #   du temps de réponse dans leur propre job (une PR qui alourdit les pages s'arrête avant la
  #   fusion) ;
  # - sur main après chaque fusion, chaque nuit, à la demande (workflow_dispatch) ou sur une PR
  #   étiquetée « suite-complete » : la suite complète, sous Chromium en quatre parts, les scénarios
  #   sous Firefox et WebKit, et les mesures du temps de réponse dans leur propre job.
  # Aucun parcours n'est supprimé : tous tournent sur main, et l'image n'est publiée (donc
  # déployable, ADR 0075) que si toute la suite est verte.
  plan-e2e:
    name: Parcours à jouer (voie rapide ou suite complète)
    runs-on: ubuntu-latest
    outputs:
      complete: ${{ steps.plan.outputs.complete }}
      matrix: ${{ steps.plan.outputs.matrix }}
      fichiers: ${{ steps.plan.outputs.fichiers }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Le commit d'une PR est sa fusion dans main : son premier parent suffit pour le différentiel.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Choisir les parcours
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node tools/ci-pipeline/plan-parcours.mjs

  e2e:
    name: Parcours bout en bout (${{ matrix.partie }})
    needs: plan-e2e
    runs-on: ubuntu-latest
    # Lot 33 : chaque connexion passe par le lien, Mailpit et Logto ; les parcours tournent en
    # série (un seul worker par job), chaque job avec sa propre base et ses propres services.
    # Historique des durées : 18/11/2026, la suite dépasse 45 min et passe en deux moitiés ; 23/11,
    # une moitié atteint 45 min, la limite passe à 60 ; trois tiers sont essayés puis abandonnés,
    # car ils déplaçaient la mesure du serveur (NFR-02) en tête d'un tiers, où elle mesurait 412 à
    # 450 ms ; 28/11, la moitié 1 compte 435 parcours et prend 48 min (74 min de parcours en tout),
    # et celle de la PR #218 est coupée à 60 min sans rendre ses traces. Lot 76 : quatre parts
    # d'environ 20 min sur main, les mesures dans leur propre job (elles ne bougent plus quand la
    # suite grandit), et une voie rapide sur les PR.
    # Limites (plan-parcours.mjs) : l'étape des parcours a la sienne, plus courte que celle du job,
    # et Playwright s'arrête proprement deux minutes avant : les traces partent même quand le temps
    # manque.
    timeout-minutes: ${{ matrix.limite_job }}
    # Lot 40c (NFR-17 à NFR-19, NFR-01, NFR-02 ; ADR 0078) : la suite sous Chromium (ordinateur et
    # 375 px, axe-core en WCAG 2.2 AA, clavier, zoom à 200 %), les parcours des scénarios rejoués sous
    # Firefox et WebKit, à 360 et à 1 920 px, et SC-10 à 150 %, et les mesures du temps de réponse.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-e2e.outputs.matrix) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: symbola
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d symbola"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: symbola
      POSTGRES_ADMIN_USER: postgres
      POSTGRES_ADMIN_PASSWORD: ci-admin-password
      POSTGRES_APP_USER: symbola_app
      POSTGRES_APP_PASSWORD: ci-app-password
      S3_ACCESS_KEY: ci-s3-access-key-000000
      S3_SECRET_KEY: ci-s3-secret-key-0000000000000000000000
      S3_BUCKET: symbola
      CLAMAV_HOST: localhost
      CLAMAV_PORT: 3310
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SIGNATURE_PROVIDER: fake
      # Lot 40c (NFR-18, ADR 0078) : adresse du banc d'essai, déclarée ; sur http://localhost, les
      # cookies partent sans « Secure », que WebKit refuserait (lib/cookie-security.ts).
      APP_PUBLIC_URL: http://localhost:3000
      # Lot 11 (ADR 0031) : géocodage simulé, aucun appel réseau à l'IGN.
      GEOCODER: fake
      # Lot 33 (ADR 0067) : fournisseur d'identité Logto, sur le réseau de l'hôte.
      LOGTO_ENDPOINT: http://localhost:3001
      LOGTO_M2M_APP_ID: symbola-bootstrap
      # Version compilée, NODE_ENV=test : faux fournisseur de signature permis
      # (jamais en production, packages/env). Lot 24a (SEC-20) : la sortie du
      # serveur est gardée, puis contrôlée après les parcours (lot 76 : ajoutée au
      # journal, le job des mesures appelant Playwright deux fois).
      E2E_SERVER_COMMAND: NODE_ENV=test pnpm exec next start -p 3000 2>&1 | tee -a e2e-server.log
    steps:
      - uses: actions/checkout@v4
      # Lot 16 (L16-SEC-01, ADR 0037) : clé de chiffrement de la double
      # authentification, générée pour ce job (aucune valeur commitée).
      - name: Clé de l'app (liens magiques scellés, lot 33) et secrets du fournisseur d'identité
        run: |
          echo "MFA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          node apps/symbola/scripts/generate-vapid-keys.mjs >> "$GITHUB_ENV"
          echo "LOGTO_M2M_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "LOGTO_DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Démarrer Garage (stockage objet)
        run: |
          docker run -d --name garage --network host \
            -v "$GITHUB_WORKSPACE/infra/compose/garage.toml:/etc/garage.toml:ro" \
            -e GARAGE_DEFAULT_ACCESS_KEY="$S3_ACCESS_KEY" \
            -e GARAGE_DEFAULT_SECRET_KEY="$S3_SECRET_KEY" \
            -e GARAGE_DEFAULT_BUCKET="$S3_BUCKET" \
            -e GARAGE_RPC_SECRET="$(openssl rand -hex 32)" \
            -e GARAGE_ADMIN_TOKEN="$(openssl rand -base64 32)" \
            -e GARAGE_METRICS_TOKEN="$(openssl rand -base64 32)" \
            dxflrs/garage:v2.5.0 /garage server --single-node --default-bucket
      - name: Démarrer ClamAV
        run: docker run -d --name clamav --network host clamav/clamav:1.4
      - name: Installer les navigateurs de Playwright (${{ matrix.navigateurs }})
        # --with-deps ajoute surtout des polices système par apt. Si les miroirs Ubuntu ne les
        # servent pas (11/11/2026 : paquets amd64v3 refusés), les navigateurs s'installent seuls :
        # l'image du runner fournit déjà les bibliothèques de Chromium. Un navigateur qui ne
        # démarre pas fait échouer les parcours eux-mêmes, avec un message clair.
        run: |
          pnpm --filter @symbola/app exec playwright install --with-deps ${{ matrix.navigateurs }} || {
            echo "::warning::Dépendances système de Playwright indisponibles (miroirs Ubuntu) : navigateurs installés sans elles."
            pnpm --filter @symbola/app exec playwright install ${{ matrix.navigateurs }}
          }
      # Lot 76 : le cache de compilation de Next (.next/cache) est repris de la dernière exécution
      # sur main ; il n'est écrit que sur main, par un seul job, pour ne pas encombrer les caches.
      - name: Cache de compilation de Next (lecture)
        uses: actions/cache/restore@v4
        with:
          path: apps/symbola/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Construire l'app (next build)
        run: pnpm --filter @symbola/app build
      - name: Cache de compilation de Next (écriture, sur main)
        if: github.event_name == 'push' && matrix.mode == 'mesures'
        uses: actions/cache/save@v4
        with:
          path: apps/symbola/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
      - name: Attendre que Garage et ClamAV soient prêts
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:3903/health; do sleep 2; done'
          timeout 180 bash -c 'until docker exec clamav clamdcheck.sh; do sleep 5; done'
      - run: pnpm --filter @symbola/db bootstrap
      - run: pnpm --filter @symbola/db migrate
      # Lot 33 (ADR 0067) : Logto initialise sa base dédiée (créée par le bootstrap), puis
      # configure-identity le règle en une commande (droit de connexion, application machine à
      # machine, application web, e-mails vers Mailpit, expérience de connexion).
      - name: Démarrer le fournisseur d'identité (Logto) et le régler
        run: |
          docker run -d --name logto --network host \
            -e DB_URL="postgres://logto:${LOGTO_DB_PASSWORD}@localhost:5432/logto" \
            -e ENDPOINT=http://localhost:3001 -e ADMIN_ENDPOINT=http://localhost:3002 \
            --entrypoint sh svhd/logto:1.46.0 -c "npm run cli db seed -- --swe --dapc && npm start"
          pnpm --filter @symbola/auth configure-identity

      # Voie rapide (pull request). Le socle doit sélectionner exactement un parcours par entrée de
      # e2e/socle.ts et par projet : un titre renommé le ferait sinon fondre en silence.
      - name: Voie rapide — le socle sélectionne un parcours par entrée
        if: matrix.mode == 'rapide'
        env:
          E2E_SOCLE: "1"
        run: |
          expected=$(( $(grep -c '^  { fichier: "' apps/symbola/e2e/socle.ts) * 2 ))
          listed=$(pnpm --filter @symbola/app exec playwright test --list ${{ matrix.projets }} | grep -Ec '^\s+\[(desktop|mobile-375)\] ')
          echo "Socle : $listed parcours sélectionnés, $expected attendus (ordinateur et 375 px)."
          test "$listed" -eq "$expected"
      - name: Parcours Playwright (voie rapide — socle et parcours modifiés par la PR)
        if: matrix.mode == 'rapide'
        timeout-minutes: ${{ matrix.limite }}
        env:
          E2E_SOCLE: "1"
          E2E_FICHIERS: ${{ needs.plan-e2e.outputs.fichiers }}
          # Les tests de mesure des fichiers modifiés tournent dans le job des mesures, serveur chaud.
          E2E_SANS_MESURES: "1"
        run: pnpm --filter @symbola/app test:e2e ${{ matrix.projets }} --global-timeout=$(( (${{ matrix.limite }} - 2) * 60000 ))

      # Suite complète : une part sous Chromium, ou les scénarios sous Firefox et WebKit. Les tests de
      # mesure n'y sont pas : ils ont leur job.
      - name: Parcours Playwright (${{ matrix.partie }})
        if: matrix.mode == 'part'
        timeout-minutes: ${{ matrix.limite }}
        env:
          E2E_SANS_MESURES: "1"
        run: pnpm --filter @symbola/app test:e2e ${{ matrix.projets }} --global-timeout=$(( (${{ matrix.limite }} - 2) * 60000 ))

      # Mesures du temps de réponse (NFR-01, NFR-02 ; ADR 0078, 0114, 0115), sur chaque PR comme sur
      # main : tous les tests dont le titre porte « NFR-01 » ou « NFR-02 » (nfr-01-02-mesures et les
      # mesures des paquets : lots 70d, 71f, 73b…), à place fixe et serveur chaud. Le serveur est
      # démarré une fois, réchauffé par le socle (ordinateur et 375 px), puis mesuré sans redémarrer.
      # Avant le lot 76, ces tests tombaient où la découpe de la suite les plaçait : 229 ms pour
      # NFR-02 sur main le 28/11/2026 (6c8f2b5c), 412 à 450 ms en tête d'une part. Chaque mesure dit
      # sa valeur ; le résumé du job reçoit le tableau des valeurs, seuils et marges.
      - name: Mesures — démarrer le serveur (gardé jusqu'à la fin du job)
        if: matrix.mode == 'mesures'
        working-directory: apps/symbola
        run: |
          nohup sh -c "$E2E_SERVER_COMMAND" > /dev/null 2>&1 &
          timeout 90 bash -c 'until curl -sf -o /dev/null http://localhost:3000/login; do sleep 1; done'
      - name: Mesures — réchauffer le serveur par le socle
        if: matrix.mode == 'mesures'
        timeout-minutes: 15
        # Un échec du réchauffement n'empêche pas les mesures : le socle est joué, et jugé, par la
        # suite complète.
        continue-on-error: true
        env:
          E2E_SERVEUR_PARTAGE: "1"
          E2E_SOCLE: "1"
        run: pnpm --filter @symbola/app test:e2e --project=desktop --project=mobile-375
      # Les mesures des parcours P0 d'abord : les mesures des paquets créent chacune des centaines de
      # lignes (500 tâches, 200 évènements, 510 fiches) dont le serveur traite ensuite les événements ;
      # jouées avant, elles alourdissaient les mesures P0 (1er essai du lot 76 : coche à 97 ms au lieu
      # de 17 à 25 sur main).
      - name: Parcours Playwright (mesures des parcours P0, NFR-01 et NFR-02)
        if: matrix.mode == 'mesures'
        timeout-minutes: ${{ matrix.limite }}
        env:
          E2E_SERVEUR_PARTAGE: "1"
          E2E_MESURES: "1"
          E2E_MESURES_FICHIER: ${{ github.workspace }}/mesures.jsonl
        run: pnpm --filter @symbola/app test:e2e ${{ matrix.projets }} nfr-01-02-mesures.spec.ts --global-timeout=$(( (${{ matrix.limite }} - 2) * 60000 ))
      - name: Parcours Playwright (mesures des paquets, NFR-02)
        if: (success() || failure()) && matrix.mode == 'mesures'
        timeout-minutes: ${{ matrix.limite }}
        env:
          E2E_SERVEUR_PARTAGE: "1"
          E2E_MESURES: "1"
          E2E_MESURES_FICHIER: ${{ github.workspace }}/mesures.jsonl
        run: pnpm --filter @symbola/app test:e2e ${{ matrix.projets }} --grep-invert=nfr-01-02-mesures --global-timeout=$(( (${{ matrix.limite }} - 2) * 60000 ))
      - name: Mesures — tableau des valeurs, seuils et marges (résumé du job)
        if: always() && matrix.mode == 'mesures'
        run: node tools/ci-pipeline/tableau-mesures.mjs "$GITHUB_WORKSPACE/mesures.jsonl" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Journaux du serveur sans adresse e-mail ni téléphone (SEC-20)
        run: pnpm --filter @symbola/privacy check:logs "$GITHUB_WORKSPACE/apps/symbola/e2e-server.log"
      # Lot 76 : publiées après tout échec, y compris un parcours arrêté par sa limite de durée.
      - name: Traces des parcours en échec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.cle }}
          path: apps/symbola/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Lot 41 (FAC-10, D4, ADR 0081) : chaque cas de facture (acompte, solde avec acomptes déduits, avoirs,
  # franchise et assujetti, particulier et professionnel, essai guidé, en français et en anglais) est
  # contrôlé par les deux validateurs de référence, jamais embarqués dans l'app : veraPDF (PDF/A-3 B)
  # et Mustang (Factur-X, règles EN 16931). Versions figées par empreinte.
  facturx:
    name: Factur-X — veraPDF (PDF/A-3 B) et Mustang (EN 16931)
    runs-on: ubuntu-latest
    env:
      # veraPDF 1.30.4 (logiciel libre, PDF Association).
      VERAPDF_IMAGE: verapdf/cli@sha256:f085855d442ad415e79fabbabcdd1803c2db4ee097cd5b94506c95ecdcfa1728
      # Mustang 2.26.0 (Apache 2.0), depuis Maven Central.
      MUSTANG_VERSION: 2.26.0
      MUSTANG_SHA256: 42d7868cb68264874a7b8cab4c3587b03b23ccc7cd72373da917f66758bb9736
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - name: Fichiers Factur-X de chaque cas (données fictives)
        run: pnpm --filter @symbola/app facturx:samples
        env:
          FACTURX_SAMPLES_DIR: ${{ runner.temp }}/facturx
      - name: veraPDF — chaque fichier est un PDF/A-3 B
        run: |
          # Lot 75 : l'image (figée par empreinte) est tirée avec de nouvelles tentatives espacées, car
          # Docker Hub refuse parfois un tirage anonyme ; l'empreinte reste vérifiée par Docker.
          for attempt in 1 2 3 4 5; do
            docker pull "$VERAPDF_IMAGE" && break
            if [ "$attempt" -eq 5 ]; then echo "Tirage de veraPDF impossible après 5 essais" >&2; exit 1; fi
            sleep $((attempt * 15))
          done
          count=$(ls "$RUNNER_TEMP"/facturx/*.pdf | wc -l)
          test "$count" -gt 0
          docker run --rm -v "$RUNNER_TEMP/facturx:/data:ro" "$VERAPDF_IMAGE" --flavour 3b --format text /data | tee "$RUNNER_TEMP/verapdf.txt"
          test "$(grep -c '^PASS ' "$RUNNER_TEMP/verapdf.txt")" -eq "$count"
      # Lot 75 : Mustang est gardé en cache (clé = version + empreinte) et ne se télécharge qu'en cas
      # d'absence, avec de nouvelles tentatives espacées (Maven Central répond parfois « 429 »). Son
      # empreinte SHA-256 est vérifiée à chaque passage, cache compris : un fichier altéré échoue.
      - name: Mustang — cache du validateur
        id: mustang-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/mustang/mustang.jar
          key: mustang-${{ env.MUSTANG_VERSION }}-${{ env.MUSTANG_SHA256 }}
      - name: Mustang — téléchargement (seulement si absent du cache)
        if: steps.mustang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/mustang
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL -o ~/.cache/mustang/mustang.jar "https://repo1.maven.org/maven2/org/mustangproject/Mustang-CLI/$MUSTANG_VERSION/Mustang-CLI-$MUSTANG_VERSION.jar" && break
            if [ "$attempt" -eq 6 ]; then echo "Téléchargement de Mustang impossible après 6 essais" >&2; exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Mustang — empreinte SHA-256 (à chaque passage)
        run: echo "$MUSTANG_SHA256  $HOME/.cache/mustang/mustang.jar" | sha256sum -c -
      - name: Mustang — mise en cache de l'archive vérifiée
        if: steps.mustang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/mustang/mustang.jar
          key: mustang-${{ env.MUSTANG_VERSION }}-${{ env.MUSTANG_SHA256 }}
      - name: Mustang — fichier structuré EN 16931 et Factur-X valides
        run: |
          for file in "$RUNNER_TEMP"/facturx/*.pdf; do
            java -jar "$HOME/.cache/mustang/mustang.jar" --action validate --no-notices --source "$file" > "$RUNNER_TEMP/report.xml" 2> /dev/null
            status=$(grep -o '<summary status="[a-z]*"/>' "$RUNNER_TEMP/report.xml" | tail -n 1)
            echo "$(basename "$file") $status"
            if [ "$status" != '<summary status="valid"/>' ]; then cat "$RUNNER_TEMP/report.xml"; exit 1; fi
          done

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config=auto --error --severity=ERROR

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: gitleaks detect --source . -v --redact --exit-code 1

  osv-scanner:
    name: OSV-Scanner (dépendances)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v1.9.1
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml

  build-and-scan-image:
    name: Build image + Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build l'image symbola (non poussée)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/symbola/Dockerfile
          tags: symbola-app:ci
          push: false
          load: true
      # Image officielle de Trivy, figée par version et empreinte (Renovate
      # propose les montées) : l'action aquasecurity/trivy-action@0.29.0 a
      # disparu de GitHub et faisait échouer ce job avant tout scan.
      # La sortie standalone ne contient que les fichiers tracés : vérifier
      # dans l'image elle-même qu'un PDF se génère (polices standard de
      # pdfkit oubliées au premier déploiement du staging, lot 6).
      - name: Génération d'un PDF dans l'image
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/apps/symbola/scripts/pdf-smoke.mjs:/tmp/pdf-smoke.mjs:ro" \
            -w /app/apps/symbola --entrypoint node symbola-app:ci /tmp/pdf-smoke.mjs
      - name: Scan Trivy (bloque sur CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress symbola-app:ci

  publish-image:
    name: Publier l'image (GHCR, SOC-09)
    # Seulement sur main, après que tous les contrôles de sécurité soient
    # verts : déployer par tag d'image (ADR 0009) suppose une image
    # publiée quelque part pour que staging/production puissent la tirer.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-typecheck-test, db-isolation, e2e, semgrep, gitleaks, osv-scanner, build-and-scan-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/symbola/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
