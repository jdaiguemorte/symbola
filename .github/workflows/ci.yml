name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:boundaries
      - name: Registre RGPD (SOC-07) — colonnes personnelles non déclarées
        run: pnpm --filter @symbola/privacy check:registry

  db-isolation:
    name: Isolation RLS et authentification (PostgreSQL réel, SOC-04/05)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: symbola
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d symbola"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: symbola
      POSTGRES_ADMIN_USER: postgres
      POSTGRES_ADMIN_PASSWORD: ci-admin-password
      POSTGRES_APP_USER: symbola_app
      POSTGRES_APP_PASSWORD: ci-app-password
      MINIO_ACCESS_KEY: ci-minio-access
      MINIO_SECRET_KEY: ci-minio-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @symbola/db bootstrap
      - run: pnpm --filter @symbola/db migrate
      - run: pnpm --filter @symbola/db test:integration
      - run: pnpm --filter @symbola/auth test:integration
      - run: pnpm --filter @symbola/app test:integration

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config=auto --error --severity=ERROR

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: gitleaks detect --source . -v --redact --exit-code 1

  osv-scanner:
    name: OSV-Scanner (dépendances)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v1.9.1
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml

  build-and-scan-image:
    name: Build image + Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build l'image symbola (non poussée)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/symbola/Dockerfile
          tags: symbola-app:ci
          push: false
          load: true
      - name: Scan Trivy (bloque sur CRITICAL)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: symbola-app:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
