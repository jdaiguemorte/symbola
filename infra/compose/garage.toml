# Config Garage (ADR 0015) — mono-nœud, développement uniquement.
# rpc_secret / admin_token / metrics_token : valeurs fixes de dev, un
# cluster mono-nœud sans exposition réseau externe n'en dépend pas pour sa
# sécurité. SOC-09/SOC-12 génèrent des valeurs propres à la production
# (jamais ces valeurs-ci, jamais committées).
metadata_dir = "/data/meta"
data_dir = "/data/data"
db_engine = "sqlite"

replication_factor = 1

