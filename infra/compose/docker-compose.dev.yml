# Socle de développement (SOC-03, ADR 0013-0014 : pas de Zitadel ni de NATS).
# Lancer depuis la racine du dépôt, pour que --env-file pointe vers .env :
#   docker compose -f infra/compose/docker-compose.dev.yml --env-file .env up -d
name: symbola-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - symbola_postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    # Remplace MinIO (ADR 0015) : image minio/minio retirée des registres
    # publics. Mono-nœud, bucket par défaut créé au démarrage.
    image: dxflrs/garage:v2.5.0 # --single-node --default-bucket exige >= 2.3
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-symbola}
      # Secrets du cluster, jamais dans garage.toml (voir .env.example).
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET requis dans .env (openssl rand -hex 32)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN requis dans .env (openssl rand -base64 32)}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:?GARAGE_METRICS_TOKEN requis dans .env (openssl rand -base64 32)}
    ports:
      - "${S3_PORT:-3900}:3900" # API S3
      - "3903:3903" # API admin
    volumes:
      - symbola_garage_data:/data
      - ./garage.toml:/etc/garage.toml:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  clamav:
    # Pas d'image arm64 officielle : émulée en amd64 (Docker Desktop sur
    # Apple Silicon gère cette émulation, un peu plus lente).
    image: clamav/clamav:1.4
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - symbola_clamav_data:/var/lib/clamav
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s # le téléchargement initial des signatures est long

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8025:8025" # interface web
      - "${SMTP_PORT:-1025}:1025" # SMTP
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Signature en ligne (DEV-02, ADR 0026), facultative en dev : le faux
  # fournisseur suffit pour coder et tester. Pour essayer le vrai Documenso :
  # secrets DOCUMENSO_* dans .env, bootstrap (crée sa base dédiée), puis
  # `--profile signature up -d` ; console sur http://localhost:3010. Ses
  # e-mails (compte administrateur) arrivent dans Mailpit.
  documenso:
    image: documenso/documenso:2.21.1
    profiles: ["signature"]
    restart: unless-stopped
    environment:
      PORT: 3000
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET:-}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:-}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:-}
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:3010
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      NEXT_PRIVATE_DATABASE_URL: postgresql://${DOCUMENSO_DB_USER:-documenso}:${DOCUMENSO_DB_PASSWORD:-}@postgres:5432/${DOCUMENSO_DB_NAME:-documenso}
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgresql://${DOCUMENSO_DB_USER:-documenso}:${DOCUMENSO_DB_PASSWORD:-}@postgres:5432/${DOCUMENSO_DB_NAME:-documenso}
      NEXT_PUBLIC_UPLOAD_TRANSPORT: database
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS: ${DOCUMENSO_SIGNING_CERT_BASE64:-}
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_SIGNING_PASSPHRASE:-}
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: mailpit
      NEXT_PRIVATE_SMTP_PORT: 1025
      NEXT_PRIVATE_SMTP_UNSAFE_IGNORE_TLS: "true"
      NEXT_PRIVATE_SMTP_FROM_NAME: Symbola
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: no-reply@symbola.test
      DOCUMENSO_DISABLE_TELEMETRY: "true"
    ports:
      - "3010:3000"
    depends_on:
      - postgres
    security_opt:
      - no-new-privileges:true

  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.insecure=true" # tableau de bord en dev uniquement
    ports:
      - "8080:80"
      - "8081:8080" # tableau de bord Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true

volumes:
  symbola_postgres_data:
  symbola_garage_data:
  symbola_clamav_data:
