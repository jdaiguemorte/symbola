<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réponse d'une invitée</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6E5C}a:hover{color:#0A4F42}
</style>
</head>
<body>
<div style="width: 390px; height: 980px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F6F7F9; color: #14181F; font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45">
<header style="padding: 24px 16px 20px; background: #FFFFFF; border-bottom: 1px solid #DDE1E7">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600; line-height: 1.2">Léa et Maxime se marient</h1>
<p style="margin: 8px 0 0; color: #5A6372">Samedi 12 juin 2027, Domaine des Tilleuls, en Dordogne</p>
</header>
<form style="flex: 1 1 auto; min-height: 0; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-weight: 600">Bonjour Jeanne, serez-vous des nôtres ?</p>
<fieldset style="margin: 0; padding: 14px 16px; background: #FFFFFF; border: 1px solid #DDE1E7; border-radius: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<legend style="float: left; width: 100%; padding: 0; font-weight: 600">Cérémonie, samedi à 15 h 30</legend>
<label style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; background: #E3F1EE; border: 2px solid #0F6E5C; border-radius: 10px; font-weight: 600"><input type="radio" name="ceremonie" checked="checked" style="width: 22px; height: 22px; margin: 0; accent-color: #0F6E5C">Oui</label>
<label style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; border: 1px solid #DDE1E7; border-radius: 10px"><input type="radio" name="ceremonie" style="width: 22px; height: 22px; margin: 0; accent-color: #0F6E5C">Non</label>
</fieldset>
<fieldset style="margin: 0; padding: 14px 16px; background: #FFFFFF; border: 1px solid #DDE1E7; border-radius: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<legend style="float: left; width: 100%; padding: 0; font-weight: 600">Dîner, samedi à 19 h 30</legend>
<label style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; background: #E3F1EE; border: 2px solid #0F6E5C; border-radius: 10px; font-weight: 600"><input type="radio" name="diner" checked="checked" style="width: 22px; height: 22px; margin: 0; accent-color: #0F6E5C">Oui</label>
<label style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; border: 1px solid #DDE1E7; border-radius: 10px"><input type="radio" name="diner" style="width: 22px; height: 22px; margin: 0; accent-color: #0F6E5C">Non</label>
</fieldset>
<fieldset style="margin: 0; padding: 14px 16px; background: #FFFFFF; border: 1px solid #DDE1E7; border-radius: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<legend style="float: left; width: 100%; padding: 0; font-weight: 600">Brunch, dimanche à 11 h</legend>
<label style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; border: 1px solid #DDE1E7; border-radius: 10px"><input type="radio" name="brunch" style="width: 22px; height: 22px; margin: 0; accent-color: #0F6E5C">Oui</label>
<label style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; background: #E3F1EE; border: 2px solid #0F6E5C; border-radius: 10px; font-weight: 600"><input type="radio" name="brunch" checked="checked" style="width: 22px; height: 22px; margin: 0; accent-color: #0F6E5C">Non</label>
</fieldset>
<label style="display: flex; flex-direction: column; gap: 8px; font-weight: 600">Un régime alimentaire à signaler ?
<select style="height: 52px; box-sizing: border-box; padding: 0 14px; background: #FFFFFF; border: 1px solid #DDE1E7; border-radius: 10px; font: 400 17px Inter, sans-serif; color: #14181F">
<option>Aucun</option>
<option>Végétarien</option>
<option selected="selected">Sans gluten</option>
<option>Sans porc</option>
<option>Autre, je précise</option>
</select>
</label>
<label style="display: flex; align-items: flex-start; gap: 12px; font-size: 15px"><input type="checkbox" style="flex: 0 0 auto; width: 22px; height: 22px; margin: 2px 0 0; accent-color: #0F6E5C"><span>J'accepte que mon régime soit transmis au traiteur. Il sera effacé après le mariage.</span></label>
<button type="button" style="height: 56px; border: 0; border-radius: 10px; background: #0F6E5C; color: #FFFFFF; font: 600 17px Inter, sans-serif; cursor: pointer">Envoyer ma réponse</button>
<p style="margin: 0; font-size: 15px; color: #5A6372">Vos réponses servent à organiser ce mariage, rien d'autre. <a href="#donnees">Vos droits sur vos données</a></p>
</form>
</div>
</body>
</html>
